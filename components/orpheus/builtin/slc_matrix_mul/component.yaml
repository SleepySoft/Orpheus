id: orpheus.builtin.slc_matrix_mul
name: 插值与平滑矩阵混音
category: 路由与混音
description: 内部多表插值或奇偶序列锁存目标，逐样本平滑矩阵并混音后显式交付
version: 1.1.0
abi_version: 7
package_type: source
