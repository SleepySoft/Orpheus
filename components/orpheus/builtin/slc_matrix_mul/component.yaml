  interp_x: {name: 插值断点, type: string, default: "0", capacity: 1024, widget: text, update_policy: restart_required}
  interp_index: {name: 插值位置, type: float, default: 0.0, update_policy: immediate, bindable: true, readback: true, persistent: true}
  interp_method: {name: 插值方法（0线性，1对数线性）, type: int, default: 0, range: [0, 1], update_policy: restart_required}
  ramp_coeff: {name: IIR斜坡系数, type: float, default: 0.0, range: [0.0, 1.0], update_policy: restart_required}
  freeze: {name: 冻结, type: int, default: 0, range: [0, 1], update_policy: immediate, bindable: true, readback: true, persistent: true}
  execution_mode: {name: 执行模式（0插值请求，1序列接收目标）, type: int, default: 0, range: [0, 1], update_policy: restart_required}
