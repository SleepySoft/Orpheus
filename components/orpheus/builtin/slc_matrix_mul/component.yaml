id: orpheus.builtin.slc_matrix_mul
name: N表插值斜坡混音矩阵
category: 高级/矩阵与混音
description: N表插值请求，或奇偶序列锁存目标的一阶IIR渐变矩阵
version: 1.1.0
abi_version: 1
package_type: source
state_type: SlcMatrixMulState
sources:
  - src/slc_matrix_mul.c
headers:
  - include/orpheus_slc_matrix_mul.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:cols
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:rows
parameters:
  - id: rows
    name: 输出行数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  - id: cols
    name: 输入列数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  - id: num_tables
    name: 插值表数量
    type: int
    default: 1
    range: [1, 8]
    update_policy: restart_required
  - id: tables
    name: 增益表
    type: string
    default: "1, 0, 0, 1"
    widget: text
    kind: bulk
    update_policy: restart_required
  - id: interp_x
    name: 插值断点
    type: string
    default: "0"
    widget: text
    update_policy: restart_required
  - id: interp_index
    name: 插值位置
    type: float
    default: 0.0
    update_policy: immediate
  - id: interp_method
    name: 插值方法
    type: int
    default: 0
    range: [0, 1]
    update_policy: restart_required
  - id: ramp_coeff
    name: IIR斜坡系数
    type: float
    default: 0.0
    range: [0.0, 1.0]
    update_policy: restart_required
  - id: freeze
    name: 冻结
    type: int
    default: 0
    range: [0, 1]
    update_policy: immediate
  - {id: execution_mode, name: 执行模式（0插值请求，1序列接收目标）, type: int, default: 0, range: [0, 1], update_policy: restart_required}
  - {id: requested_gains, name: 待接收目标矩阵, type: string, default: "", kind: bulk, shape: ["param:rows", "param:cols"], widget: text, update_policy: restart_required}
  - {id: sequence, name: 目标请求序列（奇数冻结）, type: int, default: 0, range: [-2147483648, 2147483647], persistent: true, readback: true, update_policy: block_boundary}
bulk_slots:
  - {id: requested_gains, name: 待接收目标矩阵, type: float, count: 1024, shape: ["param:rows", "param:cols"], double_bank: true}
  - {id: active_gains, name: 实际当前矩阵, type: float, count: 1024, shape: ["param:rows", "param:cols"], double_bank: true}
  - {id: accepted_targets, name: 已接收目标矩阵, type: float, count: 1024, shape: ["param:rows", "param:cols"], double_bank: true}
probes:
  - {id: last_sequence, name: 已处理序列, type: int}
  - {id: initialized, name: 包络已初始化, type: bool}
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true