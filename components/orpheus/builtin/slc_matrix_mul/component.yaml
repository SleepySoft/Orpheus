  rows: {name: 输出行数, type: int, default: 2, range: [1, 32], update_policy: restart_required, affects_signature: true}
  cols: {name: 输入列数, type: int, default: 2, range: [1, 32], update_policy: restart_required, affects_signature: true}
  num_tables: {name: 插值表数量, type: int, default: 1, range: [1, 8], update_policy: restart_required}
