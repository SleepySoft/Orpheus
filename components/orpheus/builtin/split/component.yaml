id: orpheus.builtin.split
version: 1.0.0
abi_version: 1
package_type: source
sources:
  - src/split.c
headers:
  - include/orpheus_split.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out0
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out1
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: channels
    name: Channels
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
