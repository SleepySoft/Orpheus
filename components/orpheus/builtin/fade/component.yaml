id: orpheus.builtin.fade
name: 前后衰减
category: 音效算法
description: 频谱分频前后衰减（低频全通、高频按前/后增益斜坡衰减），fade=-1 全后 +1 全前
version: 1.0.0
abi_version: 1
package_type: source
sources:
  - src/fade.c
headers:
  - include/orpheus_fade.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: fade
    name: 衰减
    type: float
    default: 0.0
    range: [-1.0, 1.0]
    update_policy: smoothed
    widget: slider
  - id: crossover_hz
    name: 分频点
    type: float
    default: 400.0
    range: [100.0, 2000.0]
    unit: Hz
    update_policy: restart_required
  - id: channels
    name: 通道数
    type: int
    default: 4
    range: [2, 32]
    update_policy: restart_required
    affects_signature: true
  - id: front_channels
    name: 前组通道数
    type: int
    default: 2
    range: [1, 31]
    update_policy: restart_required
  - id: ramp_ms
    name: 斜坡时间
    type: float
    default: 50.0
    range: [0.0, 1000.0]
    unit: ms
    update_policy: restart_required
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true