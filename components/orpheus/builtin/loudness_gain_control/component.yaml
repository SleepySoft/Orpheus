id: orpheus.builtin.loudness_gain_control
name: "RMS自动增益控制"
category: "增益与动态"
order: 1
description: "依据线性RMS电平生成目标dB增益，包含检测平滑、静音门、上下限和快压慢抬；音频仅直通，增益需由下游应用。不是标准LUFS响度控制。"
version: 1.0.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [prepare, reset]
interfaces:
  in:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    process: true
  out:
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
    drive_port_no: 1
  level:
    name: 输入线性 RMS
    description: 由 probe_rms.rms 控制连接驱动；0.1 等于 -20 dBFS
    type: float
    default: 0.0
    range: [0.0, 16.0]
    update_policy: immediate
    bindable: true
  target_db:
    name: 目标 RMS 电平
    type: float
    default: -20.0
    range: [-36.0, -6.0]
    unit: dBFS
    update_policy: smoothed
    widget: slider
  min_gain_db:
    name: 最大衰减
    type: float
    default: -12.0
    range: [-36.0, 0.0]
    unit: dB
    update_policy: smoothed
  max_gain_db:
    name: 最大提升
    type: float
    default: 12.0
    range: [0.0, 24.0]
    unit: dB
    update_policy: smoothed
  gate_db:
    name: 静音门
    type: float
    default: -55.0
    range: [-96.0, -24.0]
    unit: dBFS
    update_policy: smoothed
  detector_attack_ms:
    name: 检测启动时间
    type: float
    default: 80.0
    range: [5.0, 1000.0]
    unit: ms
    update_policy: smoothed
  detector_release_ms:
    name: 检测释放时间
    type: float
    default: 600.0
    range: [20.0, 5000.0]
    unit: ms
    update_policy: smoothed
  gain_attack_ms:
    name: 压低响应时间
    type: float
    default: 80.0
    range: [5.0, 1000.0]
    unit: ms
    update_policy: smoothed
  gain_release_ms:
    name: 抬升响应时间
    type: float
    default: 1200.0
    range: [50.0, 10000.0]
    unit: ms
    update_policy: smoothed
  channels:
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  input_db:
    name: 平滑输入电平
    type: float
    default: -120.0
    kind: probe
    access: read
    persistent: false
    unit: dBFS
    readback: true
    update_policy: immediate
  gain_db:
    name: 当前目标增益
    type: float
    default: 0.0
    kind: probe
    access: read
    persistent: false
    unit: dB
    readback: true
    control_source: true
    update_policy: immediate
  output_db:
    name: 估算输出电平
    type: float
    default: -120.0
    kind: probe
    access: read
    persistent: false
    unit: dBFS
    readback: true
    update_policy: immediate
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: true
  realtime_safe: true
