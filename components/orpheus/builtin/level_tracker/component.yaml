id: orpheus.builtin.level_tracker
name: "dB电平保持衰减"
category: "频域与分析"
version: 1.1.0
abi_version: 7
description: >-
  RMS/峰值dB输入的保持衰减包络及声压级预测。前四个1×1控制输入按RMS、峰值、音量dB补偿、快速触发排列；
  已连接输入优先于对应参数，未连接时使用显式参数。peak是唯一驱动入口，其余输入仅提供当前可见数据，
  不等待、不补调；块级双dB检测器发布peak时RMS数据已就绪。
  每个非空process调用更新一次，hold_calls按调用计数（双精度累积），衰减增量不乘音频帧数。
  mode负数冻结包络/计数并输出0，0选RMS，正数选峰值；冷启动包络为-abs(min_db)。
  上升立即跟随并恢复保持；下降差值达到hold_margin_db时累积计数，严格大于hold_calls后进入快衰减；
  差值不足仅清计数、不重新激活保持。trigger严格大于阈值时使用fast_multiplier×fast_decay_db。
  包络依次fmax下限/fmin上限，声压级为max(0,(包络+预测偏置)+音量补偿)，保留浮点运算顺序。
  第五输入volume_gain为可选线性音量，显式按20log10(gain+volume_epsilon)转换；与volume输入同时接入时拒绝，避免单位歧义。
  零帧不推进，未连输出允许NULL；reset恢复冷启动而保留配置。只提供通用状态机，不代替请求生产、调音或初始化事务。
package_type: source
algorithm:
  lifecycle: [validate, prepare, reset]
interfaces:
  rms: {direction: input, type: control, sample_format: f32, channels: 1, block_size: 1, process: false}
  peak: {direction: input, type: control, sample_format: f32, channels: 1, block_size: 1, process: true}
  volume: {direction: input, type: control, sample_format: f32, channels: 1, block_size: 1, process: false}
  fast_trigger: {direction: input, type: control, sample_format: f32, channels: 1, block_size: 1, process: false}
  volume_gain: {direction: input, type: control, sample_format: f32, channels: 1, block_size: 1, process: false}
  level: {direction: output, type: control, sample_format: f32, channels: 1, block_size: 1, drive_port_no: 1}
  envelope: {direction: output, type: control, sample_format: f32, channels: 1, block_size: 1, drive_port_no: 2}
  rms_db: {name: 无输入时RMS电平, type: float, default: -100.0, update_policy: block_boundary}
  peak_db: {name: 无输入时峰值电平, type: float, default: -100.0, update_policy: block_boundary}
  prediction_db_spl: {name: 声压级预测偏置, type: float, default: 100.0, update_policy: block_boundary}
  slow_decay_db: {name: 慢衰减每次增量, type: float, default: -0.01, update_policy: block_boundary}
  hold_margin_db: {name: 保持触发差值（非负）, type: float, default: 3.0, update_policy: block_boundary}
  hold_calls: {name: 保持调用数（非负）, type: float, default: 10.0, update_policy: block_boundary}
  fast_decay_db: {name: 快衰减每次增量, type: float, default: -1.0, update_policy: block_boundary}
  min_db: {name: 包络下限, type: float, default: -100.0, update_policy: block_boundary}
  max_db: {name: 包络上限, type: float, default: 0.0, update_policy: block_boundary}
  volume_db: {name: 无输入时音量补偿, type: float, default: 0.0, update_policy: block_boundary}
  trigger: {name: 无输入时快速触发, type: float, default: 0.0, update_policy: block_boundary}
  trigger_threshold: {name: 快速触发阈值, type: float, default: 0.0, update_policy: block_boundary}
  fast_multiplier: {name: 快速触发衰减倍数, type: float, default: 1.0, update_policy: block_boundary}
  mode: {name: 模式（负数冻结，0均方，正数峰值）, type: float, default: 0.0, update_policy: block_boundary}
  volume_epsilon: {name: 线性音量转dB正偏置, type: float, default: 2.22044605e-16, update_policy: block_boundary}
  level_db_spl: {name: 声压级输出, type: float, default: 0.0, kind: probe, access: read, persistent: false, readback: true, control_source: true, update_policy: immediate}
  envelope_db: {name: 当前包络, type: float, default: 0.0, kind: probe, access: read, persistent: false, readback: true, control_source: true, update_policy: immediate}
  holding: {name: 保持状态, type: bool, default: true, kind: probe, access: read, persistent: false, readback: true, control_source: true, update_policy: immediate}
memory: {state_size: 0, scratch_size: 0, alignment: 8}
execution: {realtime_safe: true, supports_inplace: false}
