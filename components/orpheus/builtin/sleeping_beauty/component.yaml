id: orpheus.builtin.sleeping_beauty
name: 声道分组平衡渐变
category: 增益与动态
description: 索引查表与非对称平衡目标，经四组共享指数斜坡作用于映射通道后显式交付
version: 1.2.0
abi_version: 7
package_type: source
algorithm: {lifecycle: [validate, prepare, reset, set_parameter]}
interfaces:
  in: {direction: input, type: audio, sample_format: f32, channels: "param:channels", process: true}
  out: {direction: output, type: audio, sample_format: f32, channels: "param:channels", drive_port_no: 1}
  gain_index: {name: 增益位置, type: float, default: 128.0, range: [0.0, 255.0], update_policy: smoothed, bindable: true, readback: true, persistent: true}
  offset: {name: 中心位置, type: float, default: 128.0, update_policy: restart_required}
  mutes_bass: {name: 极端静音低音, type: float, default: 0.0, range: [0.0, 1.0], update_policy: restart_required}
  ramp_ms: {name: 斜坡时间, type: float, default: 30.0, range: [0.0, 5000.0], unit: ms, update_policy: block_boundary, bindable: true, readback: true, persistent: true}
  ramp_db_per_s: {name: 斜坡速率, type: float, default: 0.0, range: [0.0, 50000.0], unit: dB/s, update_policy: block_boundary, bindable: true, readback: true, persistent: true}
  freeze: {name: 冻结斜坡, type: bool, default: false, update_policy: block_boundary, bindable: true, readback: true, persistent: true}
  center_mono_mode: {name: 中置/低音目标策略, type: string, default: attenuated, capacity: 16, widget: select, options: [attenuated, mean_lr], update_policy: restart_required}
  apply_index_on_prepare: {name: 启动时应用索引, type: bool, default: true, update_policy: restart_required}
  preserve_state_on_reset: {name: Reset保留斜坡状态, type: bool, default: false, update_policy: restart_required}
  channels: {name: 通道数, type: int, default: 4, range: [1, 64], update_policy: restart_required, affects_signature: true}
  chan_map: {name: 通道映射（-1静音）, type: string, default: "0,1,2,3", capacity: 1024, widget: text, update_policy: restart_required}
  table_idx: {name: 索引表, type: string, default: "0,10,31,52,74,95,116,128,138,159,180,202,223,244,255", capacity: 1024, widget: text, update_policy: restart_required}
  table_db: {name: 增益表, type: string, default: "-40,-30,-20,-10,0,0,0,0,0,0,0,-10,-20,-30,-40", capacity: 1024, widget: text, update_policy: restart_required}
memory: {state_size: 0, scratch_size: 0, alignment: 8}
execution: {sample_rate_independent: false, latency_samples: 0, supports_inplace: true, realtime_safe: true}
