id: orpheus.builtin.bulk_math
name: 同形数组基础二元运算
category: 基础/计算数据
version: 1.0.0
abi_version: 6
package_type: source
state_type: BulkMathState
description: >-
  同形数组逐元素运算，无历史、不广播。operation 0加、1减、2乘、3除、4稳健模长。
  模长先缩放再sqrtf，两个绝对值相等时乘单精度sqrt(2)，与生成模型数学支持函数顺序一致。
  a/b可不连接，使用对应标量参数；不隐式补齐已连接的错误尺寸。NaN/Inf按IEEE运算传递。
sources: [src/bulk_math.c]
headers: [include/orpheus_bulk_math.h]
ports:
  - {id: a, direction: input, type: bulk, sample_format: f32, channels: "param:channels", block_size: "param:elements", optional: true}
  - {id: b, direction: input, type: bulk, sample_format: f32, channels: "param:channels", block_size: "param:elements", optional: true}
  - {id: out, direction: output, type: bulk, sample_format: f32, channels: "param:channels", block_size: "param:elements"}
parameters:
  - {id: channels, name: 通道数, type: int, default: 1, range: [1, 128], update_policy: restart_required, affects_signature: true}
  - {id: elements, name: 元素数, type: int, default: 387, range: [1, 65536], update_policy: restart_required, affects_signature: true}
  - {id: operation, name: 运算, type: int, default: 2, range: [0, 4], update_policy: restart_required}
  - {id: a, name: 未连接a的值, type: float, default: 0.0, update_policy: restart_required}
  - {id: b, name: 未连接b的值, type: float, default: 0.0, update_policy: restart_required}
execution: {realtime_safe: true, supports_inplace: false}
