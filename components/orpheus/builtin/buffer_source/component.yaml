id: orpheus.builtin.buffer_source
name: "音频缓冲驱动源"
category: "驱动与缓冲"
order: 1
version: 1.1.0
abi_version: 7
package_type: source
clock_source: true
clock_domain: buffer
algorithm: {lifecycle: [normalize, prepare, reset, set_parameter]}
description: >-
  Buffer＋触发入口：宿主写入完整交错f32的samples并设置ready，再推进该源入口。
  每拍消费一块，直接驱动下游；无新数据返回错误，不补零、不等待、不自动匹配吞吐。
  作为Task源推进时，消费完整块并显式交付1号音频out。
  不自行创建线程或定时器。
interfaces:
  out: {direction: output, type: audio, sample_format: f32, channels: "param:channels", drive_port_no: 1, host_binding: {slot: samples, access: write, status: ready}}
  channels: {name: 通道数, type: int, default: 2, range: [1, 64], update_policy: restart_required, affects_signature: true}
  ready: {name: 新输入块已提交, type: bool, kind: setting, access: read_write, default: false, update_policy: immediate, readback: true, persistent: false}
  missing_blocks: {name: 缺失输入块次数, type: int, kind: probe, access: read, default: 0, update_policy: immediate, readback: true, persistent: false}
  audio_storage:
    name: 音频端口存储
    type: string
    default: ""
    capacity: 1
    persistent: false
    shape: ["config:frames", "param:channels"]
    bulk: {sample_format: f32, capacity: 8192, storage: algorithm.data, slot_key: samples, double_bank: true}
execution: {realtime_safe: true, supports_inplace: false}
