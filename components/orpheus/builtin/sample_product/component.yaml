id: orpheus.builtin.sample_product
name: 逐样本乘法
category: "数学与控制"
version: 1.1.0
abi_version: 7
package_type: source
description: 两路同shape音频逐样本相乘，不存储包络或控制历史。
interfaces:
  in: {direction: input, type: audio, sample_format: f32, channels: "param:channels", process: true}
  gain: {direction: input, type: audio, sample_format: f32, channels: "param:channels", process: true}
  out: {direction: output, type: audio, sample_format: f32, channels: "param:channels", drive_port_no: 1, drive_divide: 1}
  channels: {name: 通道数, type: int, default: 20, range: [1, 128], update_policy: restart_required, affects_signature: true, readback: true}
execution: {realtime_safe: true, supports_inplace: false}
