id: orpheus.builtin.my_effect
name: MyEffect
category: ???
version: 1.0.0
abi_version: 1
package_type: source
state_type: MyEffectState
sources:
  - src/my_effect.c
  - user/my_effect_user.c
headers:
  - include/orpheus_my_effect.h
  - user/my_effect_user.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  - id: mix
    name: 混合比
    type: float
    default: 0.5
    range: [0.0, 1.0]
    update_policy: smoothed
custom_handles:
  - id: reset
    name: 重置
    reply: false
  - id: snapshot
    name: 状态快照
    reply: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: true
  realtime_safe: true
