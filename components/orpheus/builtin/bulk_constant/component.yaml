id: orpheus.builtin.bulk_constant
name: "浮点数组常量"
category: "数学与控制"
version: 1.0.0
abi_version: 6
package_type: source
state_type: BulkConstantState
description: 固定长度f32常量表，输出完整数组及首尾元素。值数量必须恰好等于elements；配置时严格校验有限数值，无隐式补零或截断。零处理量不续调，悬空输出不阻断后继。
sources: [src/bulk_constant.c]
headers: [include/orpheus_bulk_constant.h]
ports:
  - {id: out, direction: output, type: bulk, sample_format: f32, channels: 1, block_size: "param:elements"}
  - {id: first, direction: output, type: bulk, sample_format: f32, channels: 1, block_size: 1}
  - {id: last, direction: output, type: bulk, sample_format: f32, channels: 1, block_size: 1}
parameters:
  - {id: elements, name: 元素数, type: int, default: 2, range: [1, 2048], update_policy: restart_required, affects_signature: true}
  - {id: values, name: 常量值列表, type: string, default: "0,1", update_policy: restart_required}
execution: {realtime_safe: true, supports_inplace: false}
