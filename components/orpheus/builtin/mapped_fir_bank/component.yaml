id: orpheus.builtin.mapped_fir_bank
name: 映射 FIR 滤波器组
category: 高级/滤波器组
description: 多输入、多滤波器、变长系数与输出分组求和；用于硬件 FIR accelerator 的可移植软件实现
version: 1.0.0
abi_version: 1
package_type: source
state_type: MappedFirBankState
sources:
  - src/mapped_fir_bank.c
headers:
  - include/orpheus_mapped_fir_bank.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:input_channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:output_channels
parameters:
  - {id: input_channels, name: 输入通道数, type: int, default: 2, range: [1, 64], update_policy: restart_required, affects_signature: true}
  - {id: filter_count, name: 滤波器数量, type: int, default: 2, range: [1, 64], update_policy: restart_required}
  - {id: output_channels, name: 输出通道数, type: int, default: 2, range: [1, 64], update_policy: restart_required, affects_signature: true}
  - {id: filter_lengths, name: 各滤波器抽头数, type: string, default: "1,1", update_policy: restart_required}
  - {id: coefficient_mapping, name: 滤波器到系数集映射, type: string, default: "0,1", update_policy: restart_required}
  - {id: input_mapping, name: 滤波器到输入通道映射, type: string, default: "0,1", update_policy: restart_required}
  - {id: output_starts, name: 输出分组起始滤波器, type: string, default: "0,1", update_policy: restart_required}
  - {id: output_delay_samples, name: 输出统一延迟, type: int, default: 0, range: [0, 4096], unit: samples, update_policy: restart_required}
  - {id: coefficients, name: FIR 系数, type: string, default: "1,1", kind: bulk, widget: text, update_policy: restart_required}
  - {id: max_taps, name: 最大抽头数, type: int, default: 0, readback: true, update_policy: immediate}
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true