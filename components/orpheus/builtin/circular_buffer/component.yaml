id: orpheus.builtin.circular_buffer
name: 循环缓冲分帧
category: 高级/频域
description: 带历史重叠的循环缓冲分帧组件。输入一块新样本，输出 num_frames 个展开帧（每帧 frame_size），帧移 hop_size。用于拼接 STFT 帧流。
version: 1.0.0
abi_version: 1
package_type: source
state_type: CircularBufferState
sources:
  - src/circular_buffer.c
headers:
  - include/orpheus_circular_buffer.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 64]
    update_policy: restart_required
    affects_signature: true
  - id: frame_size
    name: 帧长
    type: int
    default: 128
    range: [2, 4096]
    update_policy: restart_required
    affects_signature: true
  - id: hop_size
    name: 帧移
    type: int
    default: 64
    range: [1, 4096]
    update_policy: restart_required
    affects_signature: true
  - id: num_frames
    name: 每块输出帧数
    type: int
    default: 12
    range: [1, 256]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
