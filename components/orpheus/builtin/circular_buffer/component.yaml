id: orpheus.builtin.circular_buffer
name: "重叠音频分帧"
category: "频域与分析"
description: >-
  in每次接收hop_size*num_frames帧新样本，连同历史展开num_frames个frame_size帧窗口，
  保存末尾历史后显式交付1号out。零初始历史，不以水位或静态调度触发下游。
version: 1.2.0
abi_version: 7
package_type: source
algorithm: {lifecycle: [normalize, prepare, reset, destroy]}
interfaces:
  in: {direction: input, type: audio, sample_format: f32, channels: "param:channels", block_size: "param:hop_size*param:num_frames", process: true}
  out: {direction: output, type: audio, sample_format: f32, channels: "param:channels", block_size: "param:frame_size*param:num_frames", drive_port_no: 1}
  channels: {name: 通道数, type: int, default: 2, range: [1, 64], update_policy: restart_required, affects_signature: true}
  frame_size: {name: 帧长, type: int, default: 128, range: [2, 4096], update_policy: restart_required, affects_signature: true}
  hop_size: {name: 帧移, type: int, default: 64, range: [1, 4096], update_policy: restart_required, affects_signature: true}
  num_frames: {name: 每次输出帧数, type: int, default: 12, range: [1, 256], update_policy: restart_required, affects_signature: true}
memory: {alignment: 8}
execution: {sample_rate_independent: true, latency_samples: 0, supports_inplace: false, realtime_safe: true}
