id: orpheus.builtin.biquad_bank
name: 双二阶滤波器组
category: 高级/滤波器组
version: 1.1.0
abi_version: 1
package_type: source
state_type: BiquadBankState
deps:
  - orpheus.builtin.biquad
sources:
  - src/biquad_bank.c
headers:
  - include/orpheus_biquad_bank.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: fc0
    name: 第 1 段频率
    type: float
    default: 1000.0
    range: [20.0, 20000.0]
    unit: Hz
    update_policy: restart_required
  - id: q0
    name: 第 1 段 Q
    type: float
    default: 1.0
    range: [0.1, 10.0]
    update_policy: restart_required
  - id: gain_db0
    name: 第 1 段增益
    type: float
    default: 0.0
    range: [-24.0, 24.0]
    unit: dB
    update_policy: restart_required
  - id: fc1
    name: 第 2 段频率
    type: float
    default: 3000.0
    range: [20.0, 20000.0]
    unit: Hz
    update_policy: restart_required
  - id: q1
    name: 第 2 段 Q
    type: float
    default: 1.0
    range: [0.1, 10.0]
    update_policy: restart_required
  - id: gain_db1
    name: 第 2 段增益
    type: float
    default: 0.0
    range: [-24.0, 24.0]
    unit: dB
    update_policy: restart_required
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  - id: form
    name: 滤波结构
    type: string
    default: df2t
    widget: select
    options:
      - {value: df2t, label: "DF-II 转置（滚动，推荐）"}
      - {value: df1, label: "DF-I（传统直接 I 型）"}
    update_policy: restart_required
bulk_slots:
  - id: bq0.coefs
    name: 第 1 段系数
    type: float
    count: 5
    double_bank: true
  - id: bq1.coefs
    name: 第 2 段系数
    type: float
    count: 5
    double_bank: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
