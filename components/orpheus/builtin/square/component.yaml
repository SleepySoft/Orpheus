id: orpheus.builtin.square
name: 平方器
category: 高级/估计与统计
description: 逐样本平方 y=x²（功率 / PSD / 相干计算用）
version: 1.0.0
abi_version: 1
package_type: source
state_type: SquareState
sources:
  - src/square.c
headers:
  - include/orpheus_square.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: true
  realtime_safe: true
