id: orpheus.builtin.square
name: "逐样本平方"
category: "数学与控制"
description: 逐样本平方 y=x²（功率 / PSD / 相干计算用）
version: 1.0.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [prepare, reset, set_parameter]
interfaces:
  in:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    process: true
  out:
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
    drive_port_no: 1
    drive_divide: 1
  channels:
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: true
  realtime_safe: true
