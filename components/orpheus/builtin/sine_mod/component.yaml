id: orpheus.builtin.sine_mod
name: "正弦与周期表调制"
category: "增益与动态"
description: >-
  AM按交错样本推进相位，周期表纯乘法按音频帧推进同通道游标；
  每次in到达计算后显式交付1号out。表模式支持有符号有限float32，
  严格校验完整CSV；精确原地合法，部分重叠拒绝。
version: 1.2.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [validate, prepare, reset, set_parameter]
interfaces:
  in: {direction: input, type: audio, sample_format: f32, channels: "param:channels", process: true}
  out: {direction: output, type: audio, sample_format: f32, channels: "param:channels", drive_port_no: 1, drive_divide: 1}
  freq_hz:
    name: 调制频率
    type: float
    default: 1.0
    range: [0.01, 20000.0]
    unit: Hz
    update_policy: smoothed
  depth:
    name: 调制深度
    type: float
    default: 1.0
    range: [0.0, 1.0]
    update_policy: smoothed
    widget: slider
  channels:
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  modulation_mode:
    name: 调制方式（0为AM，1为周期表乘法）
    type: int
    default: 0
    range: [0, 1]
    update_policy: restart_required
    description: 模式1每帧取同一个有符号表值乘全部通道，不叠加1，不使用freq_hz或depth
  table_length:
    name: 周期表长度（样本）
    type: int
    default: 1
    range: [1, 1024]
    update_policy: restart_required
  carrier_table:
    name: 周期载波表
    type: string
    capacity: 65536
    default: "1"
    widget: text
    update_policy: restart_required
    description: 模式1必须提供恰好table_length项有限float32 CSV；从索引0开始，跨块连续，reset仅重置索引
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: true
  realtime_safe: true
