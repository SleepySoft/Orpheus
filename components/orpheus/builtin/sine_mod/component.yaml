id: orpheus.builtin.sine_mod
name: 正弦调制器
category: 音效/调制
description: AM/颤音调制 y=x·(1+depth·sin(2πft))，频率/深度可实时调
version: 1.0.0
abi_version: 1
package_type: source
state_type: SineModState
sources:
  - src/sine_mod.c
headers:
  - include/orpheus_sine_mod.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: freq_hz
    name: 调制频率
    type: float
    default: 1.0
    range: [0.01, 20000.0]
    unit: Hz
    update_policy: smoothed
  - id: depth
    name: 调制深度
    type: float
    default: 1.0
    range: [0.0, 1.0]
    update_policy: smoothed
    widget: slider
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: true
  realtime_safe: true
