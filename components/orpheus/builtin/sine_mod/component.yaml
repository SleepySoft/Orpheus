id: orpheus.builtin.sine_mod
name: "正弦与周期表调制"
category: "增益与动态"
description: 默认AM/颤音；可选逐帧同步的周期表纯乘法，支持有符号载波
version: 1.1.0
abi_version: 6
package_type: source
state_type: SineModState
sources:
  - src/sine_mod.c
headers:
  - include/orpheus_sine_mod.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: freq_hz
    name: 调制频率
    type: float
    default: 1.0
    range: [0.01, 20000.0]
    unit: Hz
    update_policy: smoothed
  - id: depth
    name: 调制深度
    type: float
    default: 1.0
    range: [0.0, 1.0]
    update_policy: smoothed
    widget: slider
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  - id: modulation_mode
    name: 调制方式（0兼容AM，1周期表乘法）
    type: int
    default: 0
    range: [0, 1]
    update_policy: restart_required
    description: 模式1每帧取同一个有符号表值乘全部通道，不叠加1，不使用freq_hz或depth
  - id: table_length
    name: 周期表长度（样本）
    type: int
    default: 1
    range: [1, 1024]
    update_policy: restart_required
  - id: carrier_table
    name: 周期载波表
    type: string
    default: "1"
    widget: text
    update_policy: restart_required
    description: 模式1必须提供恰好table_length项有限float32 CSV；从索引0开始，跨块连续，reset仅重置索引
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: true
  realtime_safe: true
