id: orpheus.builtin.bulk_subtract
name: 数据向量逐点相减
category: 基础/计算数据
version: 1.0.0
abi_version: 5
package_type: source
state_type: BulkSubtractState
description: >-
  同shape的两份f32 BULK逐点执行a-b，结果舍入为f32，不裁剪、不融合到下游算术。
  elements是每通道数据行数，不改变宿主时间量子；无持久历史或process分配。
  两输入均必需，允许输入相互共享存储；输出可悬空，但禁止与任一输入重叠。
sources: [src/bulk_subtract.c]
headers: [include/orpheus_bulk_subtract.h]
ports:
  - {id: a, direction: input, type: bulk, sample_format: f32, channels: "param:channels", block_size: "param:elements"}
  - {id: b, direction: input, type: bulk, sample_format: f32, channels: "param:channels", block_size: "param:elements"}
  - {id: out, direction: output, type: bulk, sample_format: f32, channels: "param:channels", block_size: "param:elements"}
parameters:
  - {id: channels, name: 通道数, type: int, default: 1, range: [1, 64], update_policy: restart_required, affects_signature: true}
  - {id: elements, name: 每通道元素数, type: int, default: 129, range: [1, 65536], update_policy: restart_required, affects_signature: true}
execution: {realtime_safe: true, supports_inplace: false}
