id: orpheus.builtin.channel_router
name: 通道索引路由
category: 通道路由
description: 按索引表将输入通道映射到输出通道，支持补零/静音（indices 为 0-based 逗号分隔，越界或 -1 置零）
version: 1.0.0
abi_version: 1
package_type: source
state_type: ChannelRouterState
sources:
  - src/channel_router.c
headers:
  - include/orpheus_channel_router.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels_in
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels_out
parameters:
  - id: channels_in
    name: 输入通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  - id: channels_out
    name: 输出通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  - id: indices
    name: 索引映射
    type: string
    default: "0,1"
    update_policy: restart_required
    widget: text
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
