id: orpheus.builtin.channel_router
name: 通道索引路由
category: "路由与混音"
description: 按0起点索引映射输入通道，负值或越界置正零；空CSV为顺序映射，非空必须恰好为输出通道数个int32。每次输入交付立即处理，不支持输入输出重叠。
version: 1.2.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [validate, prepare, reset]
interfaces:
  in: {direction: input, type: audio, sample_format: f32, channels: "param:channels_in", process: true}
  out: {direction: output, type: audio, sample_format: f32, channels: "param:channels_out", drive_port_no: 1, drive_divide: 1}
  channels_in: {name: 输入通道数, type: int, default: 2, range: [1, 64], update_policy: restart_required, affects_signature: true}
  channels_out: {name: 输出通道数, type: int, default: 2, range: [1, 64], update_policy: restart_required, affects_signature: true}
  indices: {name: 索引映射, type: string, capacity: 1024, default: "", update_policy: restart_required, widget: text}
memory: {alignment: 8}
execution: {sample_rate_independent: true, latency_samples: 0, supports_inplace: false, realtime_safe: true}
