id: orpheus.builtin.wav_in
name: WAV 文件输入
category: 文件
version: 1.0.0
abi_version: 1
package_type: source
state_type: WavInState
clock_source: true
clock_domain: file
sources:
  - src/wav_in.c
headers:
  - include/orpheus_wav_in.h
ports:
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: file_path
    name: 文件路径
    type: string
    default: ""
    widget: file
    update_policy: restart_required
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: false
