id: orpheus.builtin.pool_delay
name: 共享池整数延迟
category: 高级/滤波器组
description: 通道按当前延迟前缀和定位共享循环池；变长重解释旧池，不等同于独立通道历史
version: 1.0.0
abi_version: 1
package_type: source
state_type: PoolDelayState
sources:
  - src/pool_delay.c
headers:
  - include/orpheus_pool_delay.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 64]
    update_policy: restart_required
    affects_signature: true
  - id: pool_size_samples
    name: 共享池样本容量
    type: int
    default: 600
    range: [1, 192000]
    update_policy: restart_required
  - id: delays_i32
    name: 各通道整数延迟
    type: int
    kind: bulk
    shape: [param:channels]
    bulk_slot: delays_i32
    bindable: true
    control_source: true
    readback: true
    update_policy: block_boundary
    description: 初始全零；int32数组，逐项0到池容量。允许池地址重叠，不自动整理旧历史
bulk_slots:
  - id: delays_i32
    name: 各通道整数延迟
    type: int
    count: 64
    shape: [param:channels]
    double_bank: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
