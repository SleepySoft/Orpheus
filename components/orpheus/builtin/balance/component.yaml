id: orpheus.builtin.balance
name: "左右声道平衡"
category: "增益与动态"
description: 左右平衡增益斜坡（偶数通道=左 奇数通道=右），balance=-1 全左 +1 全右
version: 1.0.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [prepare, reset, set_parameter]
interfaces:
  in:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    process: true
  out:
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
    drive_port_no: 1
    drive_divide: 1
  balance:
    name: 平衡
    type: float
    default: 0.0
    range: [-1.0, 1.0]
    update_policy: smoothed
    widget: slider
  channels:
    name: 通道数
    type: int
    default: 2
    range: [2, 32]
    update_policy: restart_required
    affects_signature: true
  ramp_ms:
    name: 斜坡时间
    type: float
    default: 50.0
    range: [0.0, 1000.0]
    unit: ms
    update_policy: restart_required
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: true
  realtime_safe: true
