id: orpheus.builtin.iir_bank
name: N级IIR滤波器组
category: 高级/滤波器组
description: 可配置级数的级联 DF2T 双二阶 IIR 滤波器组，系数顺序 [b0,b1,b2,a1,a2]
version: 1.5.0
abi_version: 1
package_type: source
state_type: IirBankState
sources:
  - src/iir_bank.c
headers:
  - include/orpheus_iir_bank.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 64]
    update_policy: restart_required
    affects_signature: true
  - id: num_stages
    name: 级数
    type: int
    default: 4
    range: [1, 16]
    update_policy: restart_required
  - id: coefs_mode
    name: 系数模式
    type: string
    default: shared
    widget: select
    options: [shared, per_channel]
    update_policy: restart_required
    affects_signature: true
  - id: coefs
    name: IIR系数
    type: string
    default: "1,0,0,0,0"
    widget: text
    kind: bulk
    update_policy: restart_required
  - id: processing_enabled
    name: 处理使能（0输出正零并冻结历史）
    type: int
    default: 1
    range: [0, 1]
    update_policy: immediate
    bindable: true
    control_source: true
    readback: true
    persistent: true
    description: 关闭时不读取输入、不更新滤波状态；重新启用从原状态继续；reset清历史但保留使能和系数
  - id: stages_per_channel
    name: 每通道实际级数（空值沿用统一级数）
    type: string
    default: ""
    update_policy: restart_required
    widget: text
    description: 非空时必须提供channels项0到num_stages的整数；0级直接复制输入；系数CSV仍按num_stages固定跨度，未用级不执行
bulk_slots:
  - id: coefs
    name: IIR共享系数
    type: float
    count: 80
    double_bank: true
  - id: coefs_per_channel
    name: IIR每通道系数
    type: float
    count: 5120
    shape: [param:channels, 16, 5]
    double_bank: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
