id: orpheus.builtin.iir_bank
name: 级联二阶滤波器组
category: 滤波与均衡
description: 可配置级数的DF2T级联，五项系数顺序为[b0,b1,b2,a1,a2]；与直接型多项式iir不同
version: 1.5.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [validate, prepare, reset, register_slots]
interfaces:
  in:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    process: true
  out:
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
    drive_port_no: 1
  channels:
    name: 通道数
    type: int
    default: 2
    range: [1, 64]
    update_policy: restart_required
    affects_signature: true
  num_stages:
    name: 级数
    type: int
    default: 4
    range: [1, 16]
    update_policy: restart_required
  coefs_mode:
    name: 系数模式
    type: string
    capacity: 16
    default: shared
    widget: select
    options: [shared, per_channel]
    update_policy: restart_required
    affects_signature: true
  coefs:
    name: 初始系数（未提供部分保持单位节）
    type: string
    capacity: 65536
    default: "1,0,0,0,0"
    readback: false
    kind: bulk
    update_policy: restart_required
    bulk:
      sample_format: f32
      capacity: 80
      storage: algorithm.shared
      double_bank: true
      auto_register: false
  initial_coefs_per_channel:
    name: 逐通道系数初值（空值使用coefs）
    type: string
    capacity: 65536
    default: ""
    readback: false
    kind: bulk
    update_policy: restart_required
    shape: [param:channels, 16, 5]
    description: per_channel模式使用紧凑CSV，按num_stages展开到每通道80项固定跨度；只注册当前模式的BULK槽
    bulk:
      slot_key: coefs_per_channel
      sample_format: f32
      capacity: 5120
      storage: algorithm.per_channel
      double_bank: true
      auto_register: false
  processing_enabled:
    name: 处理使能（0输出正零并冻结历史）
    type: int
    default: 1
    range: [0, 1]
    update_policy: immediate
    bindable: true
    control_source: true
    readback: true
    persistent: true
  stages_per_channel:
    name: 每通道实际级数（空值沿用统一级数）
    type: string
    capacity: 1024
    default: ""
    update_policy: restart_required
    description: 非空时严格提供channels项0到num_stages的整数；0级逐位复制，未用级不读取系数或更新历史
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
