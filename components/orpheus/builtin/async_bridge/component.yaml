id: orpheus.builtin.async_bridge
name: 异步任务桥
category: "驱动与缓冲"
description: 跨 Task 的固定容量 SPSC 缓冲边界；生产任务写入，消费任务按自身块长读取
version: 1.0.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [reset, hook]
interfaces:
  in:
    direction: input
    type: audio
    process: false
    sample_format: f32
    channels: param:channels
  tick:
    direction: input
    type: trigger
    process: true
  out:
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
    block_size: task:block_size
    drive_port_no: 1
  channels:
    name: 通道数
    type: int
    default: 1
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  capacity_frames:
    name: 缓冲容量（帧）
    type: int
    default: 0
    range: [0, 1048576]
    update_policy: restart_required
  level_frames:
    name: 当前水位（帧）
    type: int
    default: 0
    readback: true
    kind: probe
    update_policy: immediate
  underruns:
    name: 欠载次数
    type: int
    default: 0
    readback: true
    kind: probe
    update_policy: immediate
  overruns:
    name: 溢出次数
    type: int
    default: 0
    readback: true
    kind: probe
    update_policy: immediate
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
scheduling:
  async_bridge: true
