id: orpheus.builtin.task_source
name: 任务驱动源
category: 基础/信号源
version: 1.0.0
abi_version: 6
package_type: source
state_type: TaskSourceState
clock_source: true
clock_domain: timer
description: 仅提供驱动接口，不产生音频。PC 由宿主推进，嵌入式按生成的 Task 调用要求接入定时器或外部入口。
sources:
  - src/task_source.c
headers:
  - include/orpheus_task_source.h
ports: []
parameters:
  - id: frequency_hz
    name: 任务频率
    type: int
    default: 100
    range: [1, 192000]
    unit: Hz
    readback: true
    update_policy: restart_required
execution:
  realtime_safe: true
  supports_inplace: false
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
