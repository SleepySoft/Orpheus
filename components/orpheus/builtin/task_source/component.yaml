id: orpheus.builtin.task_source
name: 纯任务驱动源
category: 驱动与缓冲
order: 2
version: 1.1.0
abi_version: 7
package_type: source
clock_source: true
clock_domain: timer
algorithm: {lifecycle: [set_parameter]}
description: >-
  宿主推进一次就真实交付一次out(1)，只有触发、没有PCM缓冲。
  frequency_hz声明所属Task的频率，组件不计时、不创建线程、不等待下游或自动分频。
  用显式触发接口连接消费者驱动入口；分频必须使用trigger_divider组件。
interfaces:
  out: {direction: output, type: trigger, drive_port_no: 1}
  frequency_hz: {name: 驱动频率, type: int, default: 100, range: [1, 192000], unit: Hz, readback: true, persistent: true, update_policy: restart_required}
execution: {sample_rate_independent: true, realtime_safe: true, supports_inplace: false}
