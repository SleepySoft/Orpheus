id: orpheus.builtin.task_source
name: "纯任务驱动源"
category: "驱动与缓冲"
order: 2
version: 1.0.0
abi_version: 6
package_type: source
state_type: TaskSourceState
clock_source: true
clock_domain: timer
description: 仅提供触发，不产生音频或分配PCM端口；在画布显示为紫色驱动标记，箭头指向目标节点顶部。PC由宿主推进，嵌入式绑定定时器或外部入口，不自行创建线程。
sources:
  - src/task_source.c
headers:
  - include/orpheus_task_source.h
ports: []
parameters:
  - id: frequency_hz
    name: 驱动频率
    type: int
    default: 100
    range: [1, 192000]
    unit: Hz
    readback: true
    persistent: true
    update_policy: restart_required
execution:
  realtime_safe: true
  supports_inplace: false
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
