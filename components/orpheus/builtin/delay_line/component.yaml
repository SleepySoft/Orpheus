id: orpheus.builtin.delay_line
name: "独立声道延迟"
category: "驱动与缓冲"
description: 每通道独立延迟，支持BULK向量或运行期公共整数样本延迟；切换保留历史
version: 1.2.0
abi_version: 6
package_type: source
state_type: DelayLineState
sources:
  - src/delay_line.c
headers:
  - include/orpheus_delay_line.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 64]
    update_policy: restart_required
    affects_signature: true
  - id: max_delay_samples
    name: 最大延迟样本数
    type: int
    default: 4800
    range: [1, 192000]
    update_policy: restart_required
  - id: delays_samples
    name: 每通道延迟样本数
    type: string
    default: "0,0"
    widget: text
    kind: bulk
    update_policy: restart_required
  - id: delay_samples
    name: 公共延迟样本数（-1使用逐通道配置）
    type: int
    default: -1
    range: [-1, 192000]
    update_policy: immediate
    bindable: true
    description: 非负整数统一控制所有通道，不能超过本实例max_delay_samples；-1恢复逐通道BULK配置，不清空历史
  - id: delay_vector_mode
    name: 逐通道配置类型（0浮点兼容，1整数样本）
    type: int
    default: 0
    range: [0, 1]
    update_policy: restart_required
  - id: initial_delays_i32
    name: 初始整数延迟数组
    type: string
    default: ""
    widget: text
    update_policy: restart_required
    description: 空字符串表示全零；否则必须按通道数提供完整整数CSV，仅用于初始化
  - id: delays_i32
    name: 每通道整数延迟样本数
    type: int
    kind: bulk
    shape: [param:channels]
    bulk_slot: delays_i32
    bindable: true
    control_source: true
    readback: true
    update_policy: block_boundary
    description: int32数组，逐元素范围0到本实例max_delay_samples；整组校验后在块边界提交，不清空历史
bulk_slots:
  - id: delays_samples
    name: 每通道延迟样本数
    type: float
    count: 64
    shape: [param:channels]
    double_bank: true
  - id: delays_i32
    name: 每通道整数延迟样本数
    type: int
    count: 64
    shape: [param:channels]
    double_bank: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
