id: orpheus.builtin.delay_line
name: 多通道独立延迟线
category: 高级/滤波器组
description: 每通道独立延迟样本数，支持 BULK 写入每通道延迟
version: 1.0.0
abi_version: 1
package_type: source
state_type: DelayLineState
sources:
  - src/delay_line.c
headers:
  - include/orpheus_delay_line.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  - id: max_delay_samples
    name: 最大延迟样本数
    type: int
    default: 4800
    range: [1, 192000]
    update_policy: restart_required
  - id: delays_samples
    name: 每通道延迟样本数
    type: string
    default: "0,0"
    widget: text
    kind: bulk
    update_policy: restart_required
bulk_slots:
  - id: delays_samples
    name: 每通道延迟样本数
    type: float
    count: 32
    double_bank: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
