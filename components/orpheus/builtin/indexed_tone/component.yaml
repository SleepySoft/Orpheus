id: orpheus.builtin.indexed_tone
name: "索引控制均衡"
category: "滤波与均衡"
description: "将外部索引映射为提升或衰减增益，以一阶或二阶原始滤波支路实现y=x+(G-1)f(x)，并平滑过渡；boost/cut系数可独立配置，不绑定车型或模型。"
version: 1.1.0
abi_version: 6
package_type: source
state_type: IndexedToneState
sources: [src/indexed_tone.c]
headers: [include/orpheus_indexed_tone.h]
ports:
  - {id: in, direction: input, type: audio, sample_format: f32, channels: param:channels}
  - {id: out, direction: output, type: audio, sample_format: f32, channels: param:channels}
parameters:
  - {id: channels, name: 通道数, type: int, default: 2, range: [1, 64], update_policy: restart_required, affects_signature: true}
  - {id: gain_index, name: 增益索引, type: float, default: 128.0, range: [0.0, 255.0], update_policy: smoothed}
  - {id: offset, name: 中心索引, type: float, default: 128.0, update_policy: restart_required}
  - {id: scale, name: 索引缩放, type: float, default: 127.0, update_policy: restart_required}
  - {id: max_boost_db, name: 最大提升, type: float, default: 20.0, unit: dB, update_policy: restart_required}
  - {id: max_cut_db, name: 最大衰减, type: float, default: 20.0, unit: dB, update_policy: restart_required}
  - {id: ramp_ms, name: 斜坡时间, type: float, default: 30.0, range: [0.0, 3000.0], unit: ms, update_policy: block_boundary}
  - {id: ramp_db_per_s, name: 斜坡速率, type: float, default: 0.0, range: [0.0, 50000.0], unit: dB/s, update_policy: block_boundary}
  - {id: freeze, name: 冻结斜坡, type: bool, default: false, update_policy: block_boundary}
  - {id: filter_order, name: 滤波阶数, type: int, default: 1, range: [1, 2], update_policy: restart_required}
  - {id: boost_coefs, name: Boost原始系数, type: string, default: "1,0,0,0,0", kind: bulk, shape: [5], widget: text, update_policy: restart_required}
  - {id: cut_coefs, name: Cut原始系数, type: string, default: "1,0,0,0,0", kind: bulk, shape: [5], widget: text, update_policy: restart_required}
  - {id: execution_mode, name: 执行模式（0索引请求，1显式两阶段）, type: int, default: 0, range: [0, 1], update_policy: restart_required}
  - {id: phase, name: 当前阶段（1或2）, type: int, default: 1, range: [1, 2], persistent: true, readback: true, update_policy: block_boundary}
  - {id: ramp0_current_gain, name: 阶段0当前线性增益, type: float, default: 1.0, persistent: true, readback: true, update_policy: block_boundary}
  - {id: ramp0_target_gain, name: 阶段0目标线性增益, type: float, default: 1.0, persistent: true, readback: true, update_policy: block_boundary}
  - {id: ramp0_coefficient, name: 阶段0逐样本乘数, type: float, default: 1.0, persistent: true, readback: true, update_policy: block_boundary}
  - {id: ramp0_remaining_blocks, name: 阶段0剩余块数, type: int, default: 0, range: [-2147483648, 2147483647], persistent: true, readback: true, update_policy: block_boundary}
  - {id: ramp1_current_gain, name: 阶段1当前线性增益, type: float, default: 1.0, persistent: true, readback: true, update_policy: block_boundary}
  - {id: ramp1_target_gain, name: 阶段1目标线性增益, type: float, default: 1.0, persistent: true, readback: true, update_policy: block_boundary}
  - {id: ramp1_coefficient, name: 阶段1逐样本乘数, type: float, default: 1.0, persistent: true, readback: true, update_policy: block_boundary}
  - {id: ramp1_remaining_blocks, name: 阶段1剩余块数, type: int, default: 0, range: [-2147483648, 2147483647], persistent: true, readback: true, update_policy: block_boundary}
bulk_slots:
  - {id: boost_coefs, name: Boost系数, type: float, count: 5, shape: [5], double_bank: true}
  - {id: cut_coefs, name: Cut系数, type: float, count: 5, shape: [5], double_bank: true}
memory: {state_size: 0, scratch_size: 0, alignment: 8}
execution: {sample_rate_independent: true, latency_samples: 0, supports_inplace: false, realtime_safe: true}
