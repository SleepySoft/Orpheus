id: orpheus.builtin.indexed_tone
name: 索引控制均衡
category: 滤波与均衡
description: 索引增益或显式两阶段包络驱动raw滤波支路，每次输入独立处理并交付下游。
version: 1.1.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [validate, prepare, reset, set_parameter]
interfaces:
  in: {direction: input, type: audio, sample_format: f32, channels: "param:channels", process: true}
  out: {direction: output, type: audio, sample_format: f32, channels: "param:channels", drive_port_no: 1}
  channels: {name: 通道数, type: int, default: 2, range: [1, 64], update_policy: restart_required, affects_signature: true}
  gain_index: {name: 增益索引, type: float, default: 128.0, range: [0.0, 255.0], update_policy: smoothed}
  offset: {name: 中心索引, type: float, default: 128.0, update_policy: restart_required}
  scale: {name: 索引缩放, type: float, default: 127.0, update_policy: restart_required}
  max_boost_db: {name: 最大提升, type: float, default: 20.0, unit: dB, update_policy: restart_required}
  max_cut_db: {name: 最大衰减, type: float, default: 20.0, unit: dB, update_policy: restart_required}
  ramp_ms: {name: 斜坡时间, type: float, default: 30.0, range: [0.0, 3000.0], unit: ms, update_policy: block_boundary}
  ramp_db_per_s: {name: 斜坡速率, type: float, default: 0.0, range: [0.0, 50000.0], unit: dB/s, update_policy: block_boundary}
  freeze: {name: 冻结斜坡, type: bool, default: false, update_policy: block_boundary}
  filter_order: {name: 滤波阶数, type: int, default: 1, range: [1, 2], update_policy: restart_required}
  boost_coefs:
    name: Boost原始系数
    type: string
    default: "1,0,0,0,0"
    capacity: 512
    kind: bulk
    shape: [5]
    bulk: {sample_format: f32, capacity: 5, storage: algorithm.boost_coefs, double_bank: true}
    widget: text
    update_policy: restart_required
  cut_coefs:
    name: Cut原始系数
    type: string
    default: "1,0,0,0,0"
    capacity: 512
    kind: bulk
    shape: [5]
    bulk: {sample_format: f32, capacity: 5, storage: algorithm.cut_coefs, double_bank: true}
    widget: text
    update_policy: restart_required
  execution_mode: {name: 执行模式（0索引请求，1显式两阶段）, type: int, default: 0, range: [0, 1], update_policy: restart_required}
  phase: {name: 当前阶段, type: int, default: 1, range: [1, 2], persistent: true, readback: true, update_policy: block_boundary}
  ramp0_current_gain: {name: 阶段0当前线性增益, type: float, default: 1.0, persistent: true, readback: true, update_policy: block_boundary}
  ramp0_target_gain: {name: 阶段0目标线性增益, type: float, default: 1.0, persistent: true, readback: true, update_policy: block_boundary}
  ramp0_coefficient: {name: 阶段0逐样本乘数, type: float, default: 1.0, persistent: true, readback: true, update_policy: block_boundary}
  ramp0_remaining_blocks: {name: 阶段0剩余块数, type: int, default: 0, range: [-2147483648, 2147483647], persistent: true, readback: true, update_policy: block_boundary}
  ramp1_current_gain: {name: 阶段1当前线性增益, type: float, default: 1.0, persistent: true, readback: true, update_policy: block_boundary}
  ramp1_target_gain: {name: 阶段1目标线性增益, type: float, default: 1.0, persistent: true, readback: true, update_policy: block_boundary}
  ramp1_coefficient: {name: 阶段1逐样本乘数, type: float, default: 1.0, persistent: true, readback: true, update_policy: block_boundary}
  ramp1_remaining_blocks: {name: 阶段1剩余块数, type: int, default: 0, range: [-2147483648, 2147483647], persistent: true, readback: true, update_policy: block_boundary}
memory: {alignment: 8}
execution: {sample_rate_independent: true, latency_samples: 0, supports_inplace: false, realtime_safe: true}
