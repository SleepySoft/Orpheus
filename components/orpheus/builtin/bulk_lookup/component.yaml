id: orpheus.builtin.bulk_lookup
name: "数据表线性插值"
category: "数学与控制"
version: 1.1.0
abi_version: 7
package_type: source
description: >-
  每次f32标量x交付时读取当前axis/values表，轴和值表本身不触发运算。
  axis必须有限且严格单调，支持升序/降序；越界或x为NaN输出正零。
  端点精确取表值，平坦段不做多余算术，其它点按(1-t)*左值+t*右值计算。
  不隐式裁剪x，无持久历史或process分配；NULL输出仍校验和交付，零量子不交付，禁止输出与输入重叠。
interfaces:
  x: {direction: input, type: bulk, sample_format: f32, channels: 1, block_size: 1, process: true}
  axis: {direction: input, type: bulk, sample_format: f32, channels: 1, block_size: "param:points", timing: latest}
  values: {direction: input, type: bulk, sample_format: f32, channels: 1, block_size: "param:points", timing: latest}
  out: {direction: output, type: bulk, sample_format: f32, channels: 1, block_size: 1, drive_port_no: 1}
  points: {name: 表点数, type: int, default: 2, range: [2, 2048], update_policy: restart_required, affects_signature: true}
memory: {alignment: 8}
execution: {realtime_safe: true, supports_inplace: false}
