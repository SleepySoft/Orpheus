id: orpheus.builtin.interp_lut
name: "参数查表插值"
category: "数学与控制"
description: "参数x在组件持有的x_axis/y_axis表中作一维线性插值，结果y可读回并显示历史；音频仅直通。需要通过数据端口传入查找表时使用bulk_lookup。"
version: 1.0.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [validate, prepare, reset]
interfaces:
  in:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    process: true
  out:
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
    drive_port_no: 1
  x_axis:
    name: X 轴
    type: string
    default: "0, 1"
    widget: text
    capacity: 8192
    readback: false
    update_policy: restart_required
  y_axis:
    name: Y 轴
    type: string
    default: "0, 1"
    widget: text
    capacity: 8192
    readback: false
    update_policy: restart_required
  x:
    name: 输入值
    type: float
    default: 0.0
    range: [-1000000000.0, 1000000000.0]
    update_policy: immediate
  y:
    name: 输出值
    type: float
    default: 0.0
    kind: probe
    access: read
    persistent: false
    readback: true
    update_policy: immediate
  history:
    name: 输出历史
    type: string
    default: "[]"
    capacity: 2048
    kind: probe
    access: read
    persistent: false
    readback: true
    update_policy: immediate
  channels:
    name: 通道数
    type: int
    default: 1
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: true
  realtime_safe: true
