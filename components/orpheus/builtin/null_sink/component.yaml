id: orpheus.builtin.null_sink
name: 空接收器
category: 基础/工具
description: 接收音频输入并丢弃，用于终止不需要的支路（如侧链电平检测）。
version: 1.0.0
abi_version: 1
package_type: source
state_type: NullSinkState
sources:
  - src/null_sink.c
headers:
  - include/orpheus_null_sink.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: true
  realtime_safe: true
