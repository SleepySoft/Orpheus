id: orpheus.builtin.null_sink
name: "音频丢弃端"
category: "输入与输出"
description: 接收音频输入并丢弃，用于终止不需要的支路（如侧链电平检测）。
version: 1.0.0
abi_version: 7
package_type: source
interfaces:
  in:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    process: true
  channels:
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
