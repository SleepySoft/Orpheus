id: orpheus.builtin.saturation
name: 饱和限幅
category: "增益与动态"
description: 饱和限幅（limit 上限，soft=0 硬削波 / 1 软饱和曲线）
version: 1.0.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [prepare, reset, set_parameter]
interfaces:
  in:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    process: true
  out:
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
    drive_port_no: 1
    drive_divide: 1
  limit:
    name: 上限
    type: float
    default: 0.5
    range: [0.01, 1.0]
    update_policy: smoothed
  soft:
    name: 软饱和
    type: float
    default: 0.0
    range: [0.0, 1.0]
    update_policy: smoothed
    widget: slider
  channels:
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: true
  realtime_safe: true
