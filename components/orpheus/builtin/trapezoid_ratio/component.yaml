id: orpheus.builtin.trapezoid_ratio
name: 双路梯形平滑比值
category: "数学与控制"
description: "对分子与分母数组分别作梯形递推平滑，再计算平滑分子/(平滑分母+epsilon)；可选直接除法或先倒数再乘。各元素保存独立历史，不做重采样。"
version: 1.2.0
abi_version: 7
package_type: source
algorithm: {lifecycle: [prepare, reset, destroy]}
interfaces:
  numerator: {direction: input, type: bulk, sample_format: f32, channels: "param:channels", block_size: "param:bins*param:batches", process: true}
  denominator: {direction: input, type: bulk, sample_format: f32, channels: "param:channels", block_size: "param:bins*param:batches", process: true}
  out: {direction: output, type: bulk, sample_format: f32, channels: "param:channels", block_size: "param:bins*param:batches", drive_port_no: 1}
  channels: {name: 通道数, type: int, default: 1, range: [1, 64], update_policy: restart_required, affects_signature: true}
  bins: {name: 每批向量行数, type: int, default: 129, range: [1, 65536], update_policy: restart_required, affects_signature: true}
  batches: {name: 顺序批次数, type: int, default: 1, range: [1, 64], update_policy: restart_required, affects_signature: true}
  alpha: {name: 历史系数, type: float, default: 0.9, range: [0.0, 1.0], update_policy: block_boundary}
  epsilon: {name: 分母加数, type: float, default: 2.22044605e-16, range: [0.0, 3.4028234663852886e+38], update_policy: block_boundary}
  division_mode: {name: 比值顺序（0直接除法/1先倒数再乘）, type: int, default: 0, range: [0, 1], update_policy: block_boundary}
memory: {alignment: 8}
execution: {realtime_safe: true, supports_inplace: false}
