id: orpheus.builtin.indexed_gain
name: "查表增益渐变"
category: "增益与动态"
description: "将外部索引通过自定义dB表转换为共享音频增益，并逐样本指数渐变；支持偏置、增益上限、冻结和显式冷启动值，不绑定具体音量表或模型。"
version: 1.0.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [validate, prepare, reset, set_parameter]
interfaces:
  in: {direction: input, type: audio, sample_format: f32, channels: param:channels, process: true}
  out: {direction: output, type: audio, sample_format: f32, channels: param:channels, drive_port_no: 1}
  channels: {name: 通道数, type: int, default: 2, range: [1, 64], update_policy: restart_required, affects_signature: true}
  gain_index: {name: 增益索引, type: float, default: 255.0, range: [0.0, 255.0], update_policy: smoothed}
  gain_offset_db: {name: dB偏移, type: float, default: 0.0, update_policy: block_boundary}
  max_gain_db: {name: 最大增益, type: float, default: 0.0, update_policy: restart_required}
  initial_gain: {name: 冷启动线性增益, type: float, default: 1.0, update_policy: restart_required}
  apply_index_on_prepare: {name: 初始化时应用索引, type: bool, default: true, update_policy: restart_required}
  ramp_ms: {name: 斜坡时间, type: float, default: 100.0, range: [0.0, 3000.0], unit: ms, update_policy: block_boundary}
  ramp_db_per_s: {name: 斜坡速率, type: float, default: 0.0, range: [0.0, 50000.0], unit: dB/s, update_policy: block_boundary}
  freeze: {name: 冻结斜坡, type: bool, default: false, update_policy: block_boundary}
  current_gain: {name: 当前线性增益, type: float, default: 1.0, access: read, readback: true, control_source: true, kind: probe, persistent: false}
  table_idx: {name: 索引表, type: string, capacity: 2048, default: "0,255", widget: text, update_policy: restart_required}
  table_db: {name: dB表, type: string, capacity: 2048, default: "-96,0", widget: text, update_policy: restart_required}
memory: {state_size: 0, scratch_size: 0, alignment: 8}
execution: {sample_rate_independent: true, latency_samples: 0, supports_inplace: true, realtime_safe: true}
