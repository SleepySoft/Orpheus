id: orpheus.builtin.rfft
name: 实数FFT
category: 基础算法
description: 实数FFT（半复数格式输出），FFT点数=块长，需配合downrate获取大块
version: 1.0.0
abi_version: 1
package_type: source
state_type: RfftState
sources:
  - src/rfft.c
headers:
  - include/orpheus_rfft.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
