id: orpheus.builtin.rfft
name: 实数FFT
category: 高级/频域
description: 实数FFT，支持独立FFT点数和多帧批次。spectrum为未归一化的半复数计算数据；旧音频out仍由output_mode选择半复数/幅度/功率。
version: 1.1.0
abi_version: 5
package_type: source
state_type: RfftState
sources:
  - src/rfft.c
headers:
  - include/orpheus_rfft.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
  - id: spectrum
    description: 每N槽半复数谱，hc[0]=Re(0)，hc[N/2]=Re(N/2)，hc[k]=Re(k)，hc[N-k]=Im(k)；批次帧顺排、通道交织。不受output_mode影响，不是Re/Im交织布局。
    direction: output
    type: bulk
    sample_format: f32
    channels: param:channels
    block_size: in:block_size
    layout: halfcomplex
    frame_size: param:fft_size
parameters:
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  - id: fft_size
    name: FFT 点数
    type: int
    default: 0
    range: [0, 1024]
    update_policy: restart_required
    affects_signature: true
  - id: output_mode
    name: 输出模式
    type: string
    default: "halfcomplex"
    allowed: ["halfcomplex", "magnitude", "power"]
    update_policy: restart_required
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
