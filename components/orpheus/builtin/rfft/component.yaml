id: orpheus.builtin.rfft
name: 实数FFT
category: 高级/频域
description: 实数FFT（半复数格式输出），默认 FFT 点数=块长。可设置 fft_size 将输入块拆分为多帧处理，并选择输出为 magnitude/power。
version: 1.0.0
abi_version: 1
package_type: source
state_type: RfftState
sources:
  - src/rfft.c
headers:
  - include/orpheus_rfft.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  - id: fft_size
    name: FFT 点数
    type: int
    default: 0
    range: [0, 1024]
    update_policy: restart_required
    affects_signature: true
  - id: output_mode
    name: 输出模式
    type: string
    default: "halfcomplex"
    allowed: ["halfcomplex", "magnitude", "power"]
    update_policy: restart_required
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
