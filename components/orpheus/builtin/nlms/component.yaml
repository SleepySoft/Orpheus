id: orpheus.builtin.nlms
name: 归一化最小均方
category: 自适应与降噪
description: 逐通道外部误差NLMS；ref每次到达计算旧权重输出，再用外部误差err更新；未接err时不更新也不泄漏
version: 1.0.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [prepare, reset, destroy]
interfaces:
  ref:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    process: true
  err:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    process: false
  out:
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
    drive_port_no: 1
  channels:
    name: 通道数
    type: int
    default: 2
    range: [1, 64]
    update_policy: restart_required
    affects_signature: true
  filter_length:
    name: 滤波器长度
    type: int
    default: 32
    range: [1, 4096]
    update_policy: restart_required
    affects_signature: true
  step_size:
    name: 步长
    type: float
    default: 0.01
    range: [0.0, 2.0]
    update_policy: restart_required
  leakage:
    name: 泄漏因子
    type: float
    default: 1.0
    range: [0.0, 1.0]
    update_policy: restart_required
  eps:
    name: 正则化
    type: float
    default: 0.000001
    range: [0.000000000001, 1.0]
    update_policy: restart_required
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
