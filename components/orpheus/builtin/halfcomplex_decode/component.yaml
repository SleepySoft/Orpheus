id: orpheus.builtin.halfcomplex_decode
name: 半复数频谱解包
category: 高级/频域
version: 1.0.0
abi_version: 5
package_type: source
state_type: HalfcomplexDecodeState
description: >-
  显式布局桥接，不重复FFT、窗口、缩放或重采样。每批N槽半复数hc[k]=Re(k)、hc[N-k]=Im(k)，
  选择first_bin开始的bins个非负频点，输出通道交织的Re/Im数组；
  索引=((批次*bins+频点)*2+实虚分量)*channels+通道。DC/Nyquist虚部为正零，其余位型逐字节保留。
  in兼容旧音频类型的半复数ABI，spectrum接受带halfcomplex标签的计算数据，必须且只能接一个；
  out是兼容既有无layout标签算法接口的bulk，不是PCM，不改变上游交付周期。
  FFT长度必须为2..65536的偶数，频点区间须在0..N/2之内；批次共享一次交付，无持久算法状态。
  零处理量不写输出，未连输出允许NULL；禁止输入输出内存重叠，错误输入不修改输出。
sources: [src/halfcomplex_decode.c]
headers: [include/orpheus_halfcomplex_decode.h]
input_alternatives: [[in, spectrum]]
ports:
  - {id: in, direction: input, type: audio, sample_format: f32, channels: "param:channels", block_size: "param:fft_size*param:batches"}
  - {id: spectrum, direction: input, type: bulk, sample_format: f32, channels: "param:channels", block_size: "param:fft_size*param:batches", layout: halfcomplex, frame_size: "param:fft_size"}
  - {id: out, direction: output, type: bulk, sample_format: f32, channels: "param:channels", block_size: "param:bins*2*param:batches"}
parameters:
  - {id: channels, name: 通道数, type: int, default: 2, range: [1, 64], update_policy: restart_required, affects_signature: true}
  - {id: fft_size, name: 每帧半复数槽数, type: int, default: 256, range: [2, 65536], update_policy: restart_required, affects_signature: true}
  - {id: batches, name: 批次数, type: int, default: 1, range: [1, 64], update_policy: restart_required, affects_signature: true}
  - {id: first_bin, name: 首频点（从0起）, type: int, default: 0, range: [0, 32768], update_policy: restart_required, affects_signature: true}
  - {id: bins, name: 输出频点数, type: int, default: 129, range: [1, 32769], update_policy: restart_required, affects_signature: true}
memory: {state_size: 24, scratch_size: 0, alignment: 8}
execution: {realtime_safe: true, supports_inplace: false}
