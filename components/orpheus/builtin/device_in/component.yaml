id: orpheus.builtin.device_in
name: 音频采集
category: 设备
version: 1.0.0
abi_version: 1
package_type: source
sources:
  - src/device_in.c
headers:
  - include/orpheus_device_in.h
ports:
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
