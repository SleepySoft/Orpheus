id: orpheus.builtin.probe_rms
name: "RMS电平表"
category: "频域与分析"
description: "对音频块所有通道的样本合并计算一个线性RMS，经rms读回；不是逐通道电平表。音频直通，不做dB换算、LUFS测量或自动音量均衡。"
order: 1
version: 1.0.0
abi_version: 6
package_type: source
state_type: ProbeRmsState
sources:
  - src/probe_rms.c
headers:
  - include/orpheus_probe_rms.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  - id: rms
    name: RMS
    type: float
    default: 0.0
    readback: true
    update_policy: immediate
    control_source: true  # 控制连接源（可读探针）
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: true
  realtime_safe: true
