id: orpheus.builtin.sport_tdm_in
name: SPORT/TDM 输入
category: 平台/ADI SHARC
platforms: [adsp21593]
version: 1.0.0
abi_version: 4
package_type: source
state_type: SportTdmInState
clock_source: true
sources:
  - src/sport_tdm_in.c
headers:
  - include/orpheus_sport_tdm_in.h
ports:
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
    sample_rate: param:sample_rate
parameters:
  - id: channels
    name: 逻辑通道数
    type: int
    default: 2
    range: [1, 64]
    update_policy: restart_required
    affects_signature: true
  - id: sample_rate
    name: 采样率
    type: int
    default: 48000
    range: [1000, 384000]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
