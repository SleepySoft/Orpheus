id: orpheus.builtin.signal_gen
name: 信号发生器
category: 信号源
version: 1.0.0
abi_version: 1
package_type: source
sources:
  - src/signal_gen.c
headers:
  - include/orpheus_signal_gen.h
ports:
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: frequency
    name: 频率
    type: float
    default: 440.0
    range: [1.0, 20000.0]
    unit: Hz
    update_policy: restart_required
  - id: amplitude
    name: 幅度
    type: float
    default: 0.5
    range: [0.0, 1.0]
    update_policy: smoothed
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
