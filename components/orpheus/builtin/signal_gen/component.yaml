id: orpheus.builtin.signal_gen
name: "正弦信号源"
category: "输入与输出"
description: "按频率、幅度、采样率和时长产生多通道正弦音频；不是任意波形发生器，需要扫频时使用sweep_gen。"
order: 1
version: 1.0.0
abi_version: 7
package_type: source
clock_source: true
clock_domain: synthetic
algorithm:
  lifecycle: [prepare, reset, set_parameter]
interfaces:
  out:
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
    sample_rate: param:sample_rate
    drive_port_no: 1
  sample_rate:
    name: 采样率
    type: int
    default: 48000
    range: [8000, 192000]
    unit: Hz
    update_policy: restart_required
    affects_signature: true
  frequency:
    name: 频率
    type: float
    default: 440.0
    range: [1.0, 20000.0]
    unit: Hz
    update_policy: restart_required
  amplitude:
    name: 幅度
    type: float
    default: 0.5
    range: [0.0, 1.0]
    update_policy: smoothed
  duration_s:
    name: 运行时长
    type: float
    default: 10.0
    range: [0.0, 3600.0]
    unit: s
    update_policy: restart_required
    # yaml-only：编译器据此推导离线运行时长（plan.duration_frames）；组件自身连续发声不消费它。
    # 0=跟随宿主默认（10s）；图中有 wav/mp3 输入时以文件全长为准。想一直跑请用实时运行（device_out）。
  channels:
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
