id: orpheus.builtin.signal_gen
name: 信号发生器
category: 基础/信号源
order: 1
version: 1.0.0
abi_version: 1
package_type: source
state_type: SignalGenState
clock_source: true
clock_domain: synthetic
sources:
  - src/signal_gen.c
headers:
  - include/orpheus_signal_gen.h
ports:
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
    sample_rate: param:sample_rate
parameters:
  - id: sample_rate
    name: 采样率
    type: int
    default: 48000
    range: [8000, 192000]
    unit: Hz
    update_policy: restart_required
  - id: frequency
    name: 频率
    type: float
    default: 440.0
    range: [1.0, 20000.0]
    unit: Hz
    update_policy: restart_required
  - id: amplitude
    name: 幅度
    type: float
    default: 0.5
    range: [0.0, 1.0]
    update_policy: smoothed
  - id: duration_s
    name: 运行时长
    type: float
    default: 10.0
    range: [0.0, 3600.0]
    unit: s
    update_policy: restart_required
    # yaml-only：编译器据此推导离线运行时长（plan.duration_frames）；组件自身连续发声不消费它。
    # 0=跟随宿主默认（10s）；图中有 wav/mp3 输入时以文件全长为准。想一直跑请用实时运行（device_out）。
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
