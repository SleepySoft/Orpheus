id: orpheus.builtin.negate
name: "音频反相"
category: "增益与动态"
order: 5
description: 反相：out = -in。用于主动降噪等需要取反相抵消信号的场景。
version: 1.1.0
abi_version: 7
package_type: source
interfaces:
  in: {direction: input, type: audio, sample_format: f32, channels: "param:channels", process: true}
  out: {direction: output, type: audio, sample_format: f32, channels: "param:channels", drive_port_no: 1, drive_divide: 1}
  channels:
    name: 通道数
    type: int
    default: 1
    range: [1, 64]
    update_policy: restart_required
    affects_signature: true
    readback: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: true
  realtime_safe: true
