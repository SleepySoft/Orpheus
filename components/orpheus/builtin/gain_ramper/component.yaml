id: orpheus.builtin.gain_ramper
name: "声道分组增益斜坡"
category: "增益与动态"
description: >-
  块级dB请求、显式逐样本递推或帧内幂次包络，通道映射与旁路/静音。
  in每次真实到达推进一次；算法先交付out，再交付可选的gain0块末已应用线性增益。
  1×1控制载荷不改变事件时间量子；旁路增益为1、模式2静音增益为0。
version: 1.4.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [validate, prepare, reset, set_parameter]
interfaces:
  in: {direction: input, type: audio, sample_format: f32, channels: "param:channels", process: true}
  out: {direction: output, type: audio, sample_format: f32, channels: "param:channels", drive_port_no: 1}
  gain: {direction: output, type: control, sample_format: f32, channels: 1, block_size: 1, count: "param:gain_output", optional: true, drive_port_no: 2}
  gain_db: {name: 目标增益, type: float, default: 0.0, range: [-96.0, 24.0], unit: dB, update_policy: smoothed, readback: true}
  ramp_ms: {name: 斜坡时间, type: float, default: 30.0, range: [0.0, 5000.0], unit: ms, update_policy: restart_required}
  channels: {name: 通道数, type: int, default: 2, range: [1, 64], update_policy: restart_required, affects_signature: true}
  num_rampers: {name: ramper数量, type: int, default: 1, range: [1, 32], update_policy: restart_required, affects_signature: true}
  chan_map: {name: 通道映射, type: string, capacity: 1024, default: "", widget: text, update_policy: restart_required}
  execution_mode: {name: 执行模式（0块级请求，1逐样本递推，2帧内幂次）, type: int, default: 0, range: [0, 2], update_policy: restart_required}
  current_gains:
    name: 各组当前线性增益
    type: string
    capacity: 4096
    default: ""
    kind: bulk
    shape: [param:num_rampers]
    update_policy: restart_required
    bulk: {sample_format: f32, capacity: 32, storage: algorithm.current_gains, double_bank: true}
  target_gains:
    name: 各组目标线性增益
    type: string
    capacity: 4096
    default: ""
    kind: bulk
    shape: [param:num_rampers]
    update_policy: restart_required
    bulk: {sample_format: f32, capacity: 32, storage: algorithm.target_gains, double_bank: true}
  coefficients:
    name: 各组逐样本乘数
    type: string
    capacity: 4096
    default: ""
    kind: bulk
    shape: [param:num_rampers]
    update_policy: restart_required
    bulk: {sample_format: f32, capacity: 32, storage: algorithm.coefficients, double_bank: true}
  remaining_blocks:
    name: 各组剩余块数
    type: string
    capacity: 1024
    default: ""
    kind: bulk
    shape: [param:num_rampers]
    update_policy: restart_required
    bulk: {sample_format: i32, capacity: 32, storage: algorithm.remaining_blocks, double_bank: true}
  freeze: {name: 冻结显式包络, type: bool, default: false, persistent: true, readback: true, update_policy: block_boundary}
  gain_output: {name: 输出块末通道增益, type: int, default: 0, range: [0, 1], update_policy: restart_required, affects_signature: true}
  gain_channel: {name: 观测通道（从0起）, type: int, default: 0, range: [0, 63], update_policy: restart_required}
memory: {state_size: 0, scratch_size: 0, alignment: 8}
execution: {sample_rate_independent: false, latency_samples: 0, supports_inplace: true, realtime_safe: true}
