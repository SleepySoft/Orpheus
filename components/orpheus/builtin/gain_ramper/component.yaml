id: orpheus.builtin.gain_ramper
name: "声道分组增益斜坡"
category: "增益与动态"
description: >-
  块级dB请求、显式逐样本递推或帧内幂次包络，通道映射与旁路/静音。
  gain_output=1时gain0为所选gain_channel的块末已应用线性增益（1×1控制数据）；
  旁路为1、模式2静音为0，非该组首样本增益或目标值。默认关闭，不改变旧音频与BULK接口。
version: 1.4.0
abi_version: 6
package_type: source
state_type: GainRamperState
sources:
  - src/gain_ramper.c
headers:
  - include/orpheus_gain_ramper.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
  - {id: gain, direction: output, type: control, sample_format: f32, channels: 1, block_size: 1, count: "param:gain_output", optional: true}
parameters:
  - id: gain_db
    name: 目标增益
    type: float
    default: 0.0
    range: [-96.0, 24.0]
    unit: dB
    update_policy: smoothed
  - id: ramp_ms
    name: 斜坡时间
    type: float
    default: 30.0
    range: [0.0, 5000.0]
    unit: ms
    update_policy: restart_required
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 64]
    update_policy: restart_required
    affects_signature: true
  - id: num_rampers
    name: ramper 数量
    type: int
    default: 1
    range: [1, 32]
    update_policy: restart_required
  - id: chan_map
    name: 通道映射
    type: string
    default: ""
    widget: text
    update_policy: restart_required
  - {id: execution_mode, name: 执行模式（0块级请求，1逐样本递推，2帧内幂次）, type: int, default: 0, range: [0, 2], update_policy: restart_required}
  - {id: current_gains, name: 各组当前线性增益, type: string, default: "", kind: bulk, shape: ["param:num_rampers"], widget: text, update_policy: restart_required}
  - {id: target_gains, name: 各组目标线性增益, type: string, default: "", kind: bulk, shape: ["param:num_rampers"], widget: text, update_policy: restart_required}
  - {id: coefficients, name: 各组逐样本乘数, type: string, default: "", kind: bulk, shape: ["param:num_rampers"], widget: text, update_policy: restart_required}
  - {id: remaining_blocks, name: 各组剩余块数, type: string, default: "", kind: bulk, shape: ["param:num_rampers"], range: [-2147483648, 2147483647], widget: text, update_policy: restart_required}
  - {id: freeze, name: 冻结显式包络, type: bool, default: false, persistent: true, readback: true, update_policy: block_boundary}
  - {id: gain_output, name: 输出块末通道增益, type: int, default: 0, range: [0, 1], update_policy: restart_required, affects_signature: true}
  - {id: gain_channel, name: 观测通道（从0起）, type: int, default: 0, range: [0, 63], update_policy: restart_required}
bulk_slots:
  - {id: current_gains, name: 各组当前线性增益, type: float, count: 32, shape: ["param:num_rampers"], double_bank: true}
  - {id: target_gains, name: 各组目标线性增益, type: float, count: 32, shape: ["param:num_rampers"], double_bank: true}
  - {id: coefficients, name: 各组逐样本乘数, type: float, count: 32, shape: ["param:num_rampers"], double_bank: true}
  - {id: remaining_blocks, name: 各组剩余块数, type: int, count: 32, shape: ["param:num_rampers"], double_bank: true}
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: true
  realtime_safe: true
