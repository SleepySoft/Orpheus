id: orpheus.builtin.channel_selector
name: "双源通道选择"
category: "路由与混音"
description: 按运行期整数索引从A后接B的逻辑通道空间选路，可选逐通道线性增益。每个入口逐次处理当前可见输入，不等待；无效或未接输入输出正零，不执行乘法。禁止输出与输入重叠。
version: 1.2.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [validate, prepare, reset]
interfaces:
  a: {direction: input, type: audio, sample_format: f32, channels: "param:channels_a", process: true}
  b: {direction: input, type: audio, sample_format: f32, channels: "param:channels_b", process: true}
  base: {direction: input, type: audio, sample_format: f32, channels: "param:channels_out", process: true}
  out: {direction: output, type: audio, sample_format: f32, channels: "param:channels_out", drive_port_no: 1, drive_divide: 1}
  channels_a: {name: A输入通道数, type: int, default: 2, range: [1, 64], update_policy: restart_required, affects_signature: true}
  channels_b: {name: B输入通道数, type: int, default: 2, range: [1, 64], update_policy: restart_required, affects_signature: true}
  channels_out: {name: 输出通道数, type: int, default: 2, range: [1, 64], update_policy: restart_required, affects_signature: true}
  index_base: {name: 索引起点（0或1）, type: int, default: 0, range: [0, 1], update_policy: restart_required}
  high_index_policy: {name: 正越界策略（0置零，1夹到末路）, type: int, default: 0, range: [0, 1], update_policy: restart_required}
  apply_gain: {name: 应用逐通道增益, type: bool, default: false, update_policy: restart_required}
  indices:
    name: 初始通道索引
    type: string
    capacity: 1024
    default: ""
    kind: bulk
    shape: [param:channels_out]
    update_policy: restart_required
    description: 空CSV为从index_base起的顺序映射；非空严格要求channels_out项，保留负值及int32极值，不经float转换
    bulk: {sample_format: i32, capacity: 64, storage: algorithm.indices, double_bank: true}
  gains:
    name: 初始逐通道线性增益
    type: string
    capacity: 4096
    default: ""
    kind: bulk
    shape: [param:channels_out]
    update_policy: restart_required
    description: 空CSV全1；非空严格要求channels_out个有限值。不应用增益时逐字节拷贝选中输入
    bulk: {sample_format: f32, capacity: 64, storage: algorithm.gains, double_bank: true}
  accumulate: {name: 叠加到基底输入, type: bool, default: false, update_policy: restart_required}
  enabled: {name: 选择分支使能, type: bool, default: true, update_policy: block_boundary, persistent: true, readback: true, bindable: true}
memory: {alignment: 8}
execution: {sample_rate_independent: true, latency_samples: 0, supports_inplace: false, realtime_safe: true}
