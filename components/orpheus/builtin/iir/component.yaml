id: orpheus.builtin.iir
name: "直接型任意阶IIR"
category: "滤波与均衡"
description: 归一化直接型II转置IIR，保持多项式阶数与状态递推，不转为二阶节级联
version: 1.0.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [validate, prepare, reset]
interfaces:
  in:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    process: true
  out:
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
    drive_port_no: 1
  channels:
    name: 通道数
    type: int
    default: 2
    range: [1, 64]
    update_policy: restart_required
    affects_signature: true
  order:
    name: 多项式阶数
    type: int
    default: 1
    range: [1, 16]
    update_policy: restart_required
  coefs_mode:
    name: 系数模式
    type: string
    default: shared
    capacity: 16
    widget: select
    options: [shared, per_channel]
    update_policy: restart_required
    affects_signature: true
  coefs:
    name: 系数（b0至bN，然后a1至aN，a0固定1）
    type: string
    default: "1,0,0"
    capacity: 65536
    readback: false
    widget: text
    kind: bulk
    update_policy: restart_required
    bulk:
      sample_format: f32
      capacity: 33
      storage: algorithm.shared
      double_bank: true
  initial_coefs_per_channel:
    name: 逐通道系数初值（空值使用coefs）
    type: string
    default: ""
    capacity: 65536
    readback: false
    kind: bulk
    update_policy: restart_required
    shape: [param:channels, 33]
    description: per_channel模式下非空值覆盖coefs初值，紧凑CSV按每通道2*order+1项展开为固定33项步长
    bulk:
      slot_key: coefs_per_channel
      sample_format: f32
      capacity: 2112
      storage: algorithm.per_channel
      double_bank: true
  processing_enabled:
    name: 处理使能（0输出正零并冻结历史）
    type: int
    default: 1
    range: [0, 1]
    update_policy: immediate
    bindable: true
    control_source: true
    readback: true
    persistent: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
