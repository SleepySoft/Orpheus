id: orpheus.builtin.scalar_memory
name: "标量采样保持"
category: "数学与控制"
version: 1.1.0
abi_version: 7
package_type: source
description: >-
  tick显式触发f32存储单元，in/update/initial均为latest侧输入。
  默认在交付前按update更新in；write_after_call时先交付旧值（首次用initial端口或initial_value），
  下游成功返回后才验证并提交in，允许明确顺序的同次调用反馈，不做跨Task同步。
  延后模式下游失败不提交；默认模式交付前已提交。update未接或非零时更新，否则保持。
  enabled仅透传本次i32门控，不驱动其它节点；NULL输出仍交付并更新，零量子不交付。
algorithm:
  lifecycle: [prepare, reset, set_parameter]
interfaces:
  in: {direction: input, type: bulk, sample_format: f32, channels: 1, block_size: 1, timing: latest, allow_unready: true}
  update: {direction: input, type: bulk, sample_format: i32, channels: 1, block_size: 1, timing: latest}
  initial: {direction: input, type: bulk, sample_format: f32, channels: 1, block_size: 1, timing: latest}
  tick: {direction: input, type: trigger, process: true}
  out: {direction: output, type: bulk, sample_format: f32, channels: 1, block_size: 1, drive_port_no: 1}
  enabled: {direction: output, type: bulk, sample_format: i32, channels: 1, block_size: 1}
  initial_value: {name: 首次反馈读值, type: float, default: 0.0, update_policy: block_boundary, readback: true}
  write_after_call: {name: 交付返回后提交反馈, type: bool, default: false, update_policy: restart_required}
memory: {alignment: 8}
execution: {realtime_safe: true, supports_inplace: false}
