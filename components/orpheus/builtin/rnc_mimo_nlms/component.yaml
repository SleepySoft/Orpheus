id: orpheus.builtin.rnc_mimo_nlms
name: 多参考多输出NLMS
category: 自适应与降噪
description: 外部filtered_error驱动权值更新的多参考多输出FIR；ref实际到达触发，逐调用轮转泄漏一条参考到输出路径
version: 1.1.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [validate, prepare, reset]
interfaces:
  ref: {direction: input, type: audio, sample_format: f32, channels: "param:reference_channels", process: true}
  filtered_error: {direction: input, type: audio, sample_format: f32, channels: "param:output_channels", process: false}
  out: {direction: output, type: audio, sample_format: f32, channels: "param:output_channels", drive_port_no: 1}
  reference_channels: {name: 参考通道数, type: int, default: 12, range: [1, 12], update_policy: restart_required, affects_signature: true}
  output_channels: {name: 输出通道数, type: int, default: 8, range: [1, 8], update_policy: restart_required, affects_signature: true}
  filter_length: {name: 自适应滤波长度, type: int, default: 125, range: [1, 125], update_policy: restart_required, affects_signature: true}
  step_sizes:
    name: 各输出步长
    type: string
    capacity: 1024
    default: ""
    readback: false
    kind: bulk
    shape: [param:output_channels]
    update_policy: restart_required
    bulk: {sample_format: f32, capacity: 8, storage: algorithm.step_sizes}
  leakage: {name: 泄漏因子, type: float, default: 1.0, range: [0.0, 1.0], update_policy: restart_required}
  eps: {name: 归一化正则项, type: float, default: 0.00001, range: [0.000000000001, 1.0], update_policy: restart_required}
  initial_weights:
    name: 初始权值
    type: string
    capacity: 262144
    default: ""
    readback: false
    kind: bulk
    shape: [param:output_channels, param:reference_channels, param:filter_length]
    update_policy: restart_required
    bulk: {slot_key: weights, sample_format: f32, capacity: 12000, storage: algorithm.weights, double_bank: true}
memory: {alignment: 8}
execution: {sample_rate_independent: true, latency_samples: 0, supports_inplace: false, realtime_safe: true}
