id: orpheus.builtin.frame_energy
name: 音频帧总能量
category: 高级/估计与统计
description: >-
  固定窗口内逐帧按通道声明顺序累加平方，再按帧顺序累加为一个f32 BULK标量。
  平方、通道加法、帧加法分别舍入；总和初值负零，不平均、不转dB、不广播、不跨调用累计。
  输入为交错f32音频，窗口尺寸独立于调用节拍。NULL输出仍校验输入；零处理量不写输出。
version: 1.0.0
abi_version: 5
package_type: source
state_type: FrameEnergyState
sources: [src/frame_energy.c]
headers: [include/orpheus_frame_energy.h]
ports:
  - {id: in, direction: input, type: audio, sample_format: f32, channels: "param:channels", block_size: "param:frames"}
  - {id: out, direction: output, type: bulk, sample_format: f32, channels: 1, block_size: 1}
parameters:
  - {id: channels, name: 通道数, type: int, default: 2, range: [1, 128], update_policy: restart_required, affects_signature: true}
  - {id: frames, name: 窗口帧数, type: int, default: 128, range: [1, 65536], update_policy: restart_required, affects_signature: true}
memory: {state_size: 0, scratch_size: 0, alignment: 8}
execution: {sample_rate_independent: true, latency_samples: 0, supports_inplace: false, realtime_safe: true}
