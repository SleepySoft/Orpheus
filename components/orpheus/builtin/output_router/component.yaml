id: orpheus.builtin.output_router
name: "静态矩阵路由"
category: "路由与混音"
description: 矩阵混音路由，按增益矩阵将输入混音到输出（matrix 为行优先逗号分隔增益，identity=对角直通）
version: 1.0.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [validate, prepare, reset]
interfaces:
  in:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels_in
    process: true
  out:
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels_out
    drive_port_no: 1
  channels_in:
    name: 输入通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  channels_out:
    name: 输出通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  matrix:
    name: 混音矩阵
    type: string
    default: "identity"
    capacity: 32768
    update_policy: restart_required
    widget: text
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
