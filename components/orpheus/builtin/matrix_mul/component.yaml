id: orpheus.builtin.matrix_mul
name: 矩阵乘法
category: 高级/矩阵与混音
description: 矩阵乘音频块（out[rows] = M(rows×cols) · in[cols]，M 为 BULK 系数）
version: 1.0.0
abi_version: 1
package_type: source
state_type: MatrixMulState
sources:
  - src/matrix_mul.c
headers:
  - include/orpheus_matrix_mul.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:cols
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:rows
parameters:
  - id: rows
    name: 输出行数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  - id: cols
    name: 输入列数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  - id: matrix
    name: 矩阵系数
    type: string
    default: "1, 0, 0, 1"
    widget: text
    kind: bulk
    update_policy: restart_required
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
