id: orpheus.builtin.one_pole_envelope
name: 逐样本一阶包络
category: 基础/计算
version: 1.0.0
abi_version: 6
package_type: source
state_type: OnePoleEnvelopeState
sources: [src/one_pole_envelope.c]
headers: [include/orpheus_one_pole_envelope.h]
description: 无跨调用状态；显式起始值按每样本(1-alpha)*target+alpha*gain递推，冻结时保持起始值；发布音频率包络及末样本增益。
ports:
  - {id: start, direction: input, type: bulk, sample_format: f32, channels: "param:channels", block_size: 1}
  - {id: target, direction: input, type: bulk, sample_format: f32, channels: "param:channels", block_size: 1}
  - {id: alpha, direction: input, type: bulk, sample_format: f32, channels: 1, block_size: 1}
  - {id: freeze, direction: input, type: bulk, sample_format: i32, channels: 1, block_size: 1}
  - {id: out, direction: output, type: audio, sample_format: f32, channels: "param:channels"}
  - {id: gains, direction: output, type: bulk, sample_format: f32, channels: "param:channels", block_size: 1}
parameters:
  - {id: channels, name: 包络通道数, type: int, default: 20, range: [1, 128], update_policy: restart_required, affects_signature: true}
execution: {realtime_safe: true, supports_inplace: false}
