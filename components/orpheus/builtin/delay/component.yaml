id: orpheus.builtin.delay
name: "音频延迟与干湿混合"
category: "驱动与缓冲"
description: "以毫秒设置音频延迟，所有通道采用同一延迟量；mix控制干声与延迟声的混合。与逐通道独立延迟及共享池延迟的存储模型不同。"
version: 1.0.1
abi_version: 7
package_type: source
algorithm:
  lifecycle: [prepare, reset, destroy, set_parameter]
interfaces:
  in:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    process: true
  out:
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
    drive_port_no: 1
    drive_divide: 1
  delay_ms:
    name: 延迟时间
    type: float
    default: 100.0
    range: [0.0, 5000.0]
    unit: ms
    update_policy: restart_required
  mix:
    name: 混合比
    type: float
    default: 0.5
    range: [0.0, 1.0]
    update_policy: smoothed
  channels:
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
