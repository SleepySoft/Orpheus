id: orpheus.builtin.delay
version: 1.0.0
abi_version: 1
package_type: source
sources:
  - src/delay.c
headers:
  - include/orpheus_delay.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: delay_ms
    name: Delay Time
    type: float
    default: 100.0
    range: [0.0, 5000.0]
    unit: ms
    update_policy: restart_required
  - id: mix
    name: Mix
    type: float
    default: 0.5
    range: [0.0, 1.0]
    update_policy: smoothed
  - id: channels
    name: Channels
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
