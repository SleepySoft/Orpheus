id: orpheus.builtin.scalar_math
name: 标量基础运算
category: "数学与控制"
version: 1.2.0
abi_version: 7
package_type: source
description: >-
  单个f32 BULK基础运算：0最小、1最大、2大于、3不等、4选择(a非零取b否则c)、5直通a、
  6加、7减、8乘、9除、10绝对值、11常用对数。每个数据入口逐次处理当前可见值，
  未连接输入使用a_default/b_default/c_default。无数据驱动时可显式触发tick。
  比较输出为f32的0或1，保留IEEE算术，不隐式夹界；NULL输出仍交付，零量子不交付。
interfaces:
  a: {direction: input, type: bulk, sample_format: f32, channels: 1, block_size: 1, process: true}
  b: {direction: input, type: bulk, sample_format: f32, channels: 1, block_size: 1, process: true}
  c: {direction: input, type: bulk, sample_format: f32, channels: 1, block_size: 1, process: true}
  tick: {direction: input, type: trigger, process: true}
  out: {direction: output, type: bulk, sample_format: f32, channels: 1, block_size: 1, drive_port_no: 1}
  operation: {name: "运算(0最小/1最大/2大于/3不等/4选择/5直通/6加/7减/8乘/9除/10绝对值/11对数)", type: int, default: 5, range: [0, 11], update_policy: block_boundary, readback: true}
  a_default: {name: 未连接a的值, type: float, default: 0.0, update_policy: block_boundary, readback: true}
  b_default: {name: 未连接b的值, type: float, default: 0.0, update_policy: block_boundary, readback: true}
  c_default: {name: 未连接c的值, type: float, default: 0.0, update_policy: block_boundary, readback: true}
memory: {alignment: 8}
execution: {realtime_safe: true, supports_inplace: false}
