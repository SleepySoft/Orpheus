id: orpheus.builtin.exponential_gain
name: 指数增益斜坡
category: "增益与动态"
description: 显式目标、每样本乘数和剩余调用块数的指数增益核；不自动将毫秒转换为请求。所有通道共享同一条逐样本包络。
version: 1.0.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [prepare, reset, set_parameter]
interfaces:
  in:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    process: true
    optional: true
  out:
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
    drive_port_no: 1
    drive_divide: 1
    optional: true
  channels:
    name: 通道数
    type: int
    default: 2
    range: [1, 64]
    update_policy: restart_required
    affects_signature: true
  target_gain:
    name: 目标增益
    type: float
    default: 1.0
    update_policy: block_boundary
    bindable: true
    readback: true
    persistent: true
  ramp_coefficient:
    name: 每样本指数乘数
    type: float
    default: 1.0
    update_policy: block_boundary
    bindable: true
    readback: true
    persistent: true
  remaining_blocks:
    name: 剩余调用块数
    type: float
    default: 0.0
    range: [0.0, 16777216.0]
    update_policy: block_boundary
    bindable: true
    control_source: true
    readback: true
    persistent: true
  initial_gain:
    name: 初始增益
    type: float
    default: 1.0
    update_policy: restart_required
  min_gain:
    name: 指数起点下限
    type: float
    default: 4.7315126e-7
    update_policy: restart_required
  snap_threshold:
    name: 目标吸附阈值
    type: float
    default: 1.0e-9
    update_policy: restart_required
  current_gain:
    name: 当前增益
    type: float
    default: 1.0
    kind: probe
    readback: true
    control_source: true
    readonly: true
    persistent: false
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: true
  realtime_safe: true
