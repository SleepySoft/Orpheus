id: orpheus.builtin.bulk_interleave
name: "数组通道合并"
category: "路由与混音"
description: "将多路单通道f32数组按元素位置合为交错多通道数组；每路elements项，不做数学运算或改变调用周期。"
version: 1.1.0
abi_version: 7
package_type: source
interfaces:
  in: {direction: input, type: bulk, sample_format: f32, channels: 1, block_size: "param:elements", count: "param:channels", process: true}
  out: {direction: output, type: bulk, sample_format: f32, channels: "param:channels", block_size: "param:elements", drive_port_no: 1, drive_divide: 1}
  channels: {name: 通道数, type: int, default: 2, range: [1, 128], update_policy: restart_required, affects_signature: true, readback: true}
  elements: {name: 每通道元素数, type: int, default: 129, range: [1, 65536], update_policy: restart_required, affects_signature: true, readback: true}
execution: {realtime_safe: true, supports_inplace: false}
