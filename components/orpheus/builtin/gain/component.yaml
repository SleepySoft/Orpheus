id: orpheus.builtin.gain
name: 增益
category: 基础/增益与混音
order: 1
version: 1.2.0
abi_version: 1
package_type: source
state_type: GainState
sources:
  - src/gain.c
headers:
  - include/orpheus_gain.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: gain_db
    name: 增益
    type: float
    default: 0.0
    range: [-96.0, 24.0]
    unit: dB
    update_policy: smoothed
    bindable: true  # 控制连接目标（smoothed 策略合规）
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  - id: smoothing_ms
    name: 平滑时间
    type: float
    default: 5.0
    range: [0.0, 1000.0]
    unit: ms
    update_policy: restart_required
  - id: gain_mode
    name: 增益模式（0=dB，1=共享线性，2=逐通道线性）
    type: int
    default: 0
    range: [0, 2]
    update_policy: restart_required
  - id: gain_linear
    name: 线性目标增益
    type: float
    default: 1.0
    update_policy: smoothed
    bindable: true
    description: 仅在线性模式生效；允许零和负数，每帧计算一次并同步应用到所有通道
  - id: linear_b0
    name: 线性控制平滑分子
    type: float
    default: 1.0
    update_policy: restart_required
  - id: linear_a1
    name: 线性控制平滑反馈系数
    type: float
    default: 0.0
    range: [-1.0, 1.0]
    update_policy: restart_required
    description: 线性模式按y=b0×目标+z、z=-a1×y递推；要求-1<a1<1。b0=1且a1=0时直接相乘，不平滑
  - id: gains
    name: 逐通道线性增益
    type: string
    default: ""
    kind: bulk
    shape: [param:channels]
    update_policy: restart_required
    description: 模式2使用；空CSV为全1，非空严格要求channels个有限值。运行期用同名浮点BULK整组写入，不进行dB转换或平滑
bulk_slots:
  - id: gains
    name: 逐通道线性增益
    type: float
    count: 32
    shape: [param:channels]
    double_bank: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: true
  realtime_safe: true
