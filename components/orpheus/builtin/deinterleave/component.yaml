id: orpheus.builtin.deinterleave
name: "音频通道拆分"
category: "路由与混音"
description: 将一路 N 通道交错信号拆分为 N 路单声道输出（out0..outN-1），输出引脚数量随通道数变化
version: 1.0.0
abi_version: 7
package_type: source
interfaces:
  in:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    process: true
  out:
    direction: output
    type: audio
    sample_format: f32
    channels: 1
    count: param:channels
    drive_port_no: 1
    drive_divide: 1
  channels:
    name: 通道数
    type: int
    default: 2
    range: [1, 64]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
