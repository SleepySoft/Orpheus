id: orpheus.builtin.resample
name: 降采样器
category: 高级/多速率
description: 整数倍降采样（N:1），默认滑动平均，也可按指定相位纯选点；纯选点须由上游承担抗混叠
version: 1.1.0
abi_version: 6
package_type: source
state_type: ResampleState
scheduling:
  divisor: param:factor
sources:
  - src/resample.c
headers:
  - include/orpheus_resample.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
    sample_rate: in:sample_rate/param:factor
parameters:
  - id: mode
    name: 抽取方式（0=平均，1=选点）
    type: int
    default: 0
    range: [0, 1]
    update_policy: restart_required
  - id: phase
    name: 选点相位
    type: int
    default: 0
    range: [0, 63]
    description: 纯选点模式取每组中此0基位置的样本，必须小于抽取比
    update_policy: restart_required
  - id: factor
    name: 抽取比
    type: int
    default: 2
    range: [2, 64]
    update_policy: restart_required
    affects_signature: true
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
