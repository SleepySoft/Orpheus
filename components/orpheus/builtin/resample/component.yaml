id: orpheus.builtin.resample
name: 降采样器
category: 速率变换
description: 整数倍降采样（N:1，滑动平均抗混叠）：输入每 N 个样本输出 1 个，下游按分频调度执行
version: 1.0.0
abi_version: 1
package_type: source
state_type: ResampleState
scheduling:
  divisor: param:factor
sources:
  - src/resample.c
headers:
  - include/orpheus_resample.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
    sample_rate: task:sample_rate/param:factor
parameters:
  - id: factor
    name: 抽取比
    type: int
    default: 2
    range: [2, 64]
    update_policy: restart_required
    affects_signature: true
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
