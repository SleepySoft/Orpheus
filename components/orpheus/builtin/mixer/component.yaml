id: orpheus.builtin.mixer
name: "双路加权混音"
category: "路由与混音"
description: >-
  两路同通道音频分别乘gain0、gain1后相加；任一输入到达即计算并显式交付1号out，
  不等待会合或去重。保留原逐样本增益趋近与乘后相加的float32顺序，
  不支持原地或部分重叠；两输入均必需，不是任意通道矩阵路由。
order: 2
version: 1.1.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [prepare, reset, set_parameter]
interfaces:
  in0: {direction: input, type: audio, sample_format: f32, channels: "param:channels", process: true}
  in1: {direction: input, type: audio, sample_format: f32, channels: "param:channels", process: true}
  out: {direction: output, type: audio, sample_format: f32, channels: "param:channels", drive_port_no: 1, drive_divide: 1}
  gain0:
    name: 增益 0
    type: float
    default: 0.0
    range: [-96.0, 24.0]
    unit: dB
    update_policy: smoothed
  gain1:
    name: 增益 1
    type: float
    default: 0.0
    range: [-96.0, 24.0]
    unit: dB
    update_policy: smoothed
  channels:
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
