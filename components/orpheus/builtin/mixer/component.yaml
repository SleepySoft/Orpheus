id: orpheus.builtin.mixer
name: "双路加权混音"
category: "路由与混音"
description: "两路同通道音频分别乘gain0、gain1后相加；这是双输入加权混音，不是任意通道矩阵路由。"
order: 2
version: 1.0.0
abi_version: 6
package_type: source
state_type: MixerState
sources:
  - src/mixer.c
headers:
  - include/orpheus_mixer.h
ports:
  - id: in0
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: in1
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: gain0
    name: 增益 0
    type: float
    default: 0.0
    range: [-96.0, 24.0]
    unit: dB
    update_policy: smoothed
  - id: gain1
    name: 增益 1
    type: float
    default: 0.0
    range: [-96.0, 24.0]
    unit: dB
    update_policy: smoothed
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
