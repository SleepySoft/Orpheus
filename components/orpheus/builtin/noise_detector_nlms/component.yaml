id: orpheus.builtin.noise_detector_nlms
name: NLMS残差分析
category: 频域与分析
description: ref仅供数据/in驱动NLMS学习线性路径，直通被测信号并报告残差/ERLE；残差含模型失配和未收敛误差，不等同标准THD+N
version: 1.0.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [prepare, reset, destroy, get_parameter]
interfaces:
  ref: {direction: input, type: audio, sample_format: f32, channels: "param:channels", process: false}
  in: {direction: input, type: audio, sample_format: f32, channels: "param:channels", process: true}
  out: {direction: output, type: audio, sample_format: f32, channels: "param:channels", drive_port_no: 1}
  channels: {name: 通道数, type: int, default: 2, range: [1, 32], update_policy: restart_required, affects_signature: true}
  filter_length: {name: 滤波器长度, type: int, default: 64, range: [1, 4096], update_policy: restart_required}
  step_size: {name: 步长, type: float, default: 0.1, range: [0.0, 1.0], update_policy: restart_required}
  leakage: {name: 泄漏因子, type: float, default: 1.0, range: [0.0, 1.0], update_policy: restart_required}
  eps: {name: 正则化, type: float, default: 0.000001, range: [0.000000000001, 1.0], update_policy: restart_required}
  time_thres: {name: 时域残差阈值, type: float, default: 0.02, range: [0.0, 1.0], update_policy: restart_required}
  frame_thres_db: {name: 调用残差预算(dB), type: float, default: -25.0, range: [-120.0, 0.0], unit: dB, update_policy: restart_required}
  residue_db: {name: 残差能量(dB), type: float, default: 0.0, kind: probe, access: read, readback: true}
  erle_db: {name: ERLE(dB), type: float, default: 0.0, kind: probe, access: read, readback: true}
  noise_frames: {name: 噪声调用数, type: int, default: 0, kind: probe, access: read, readback: true}
  noise_ratio: {name: 噪声占比, type: float, default: 0.0, kind: probe, access: read, readback: true}
  clicks: {name: 突刺计数, type: int, default: 0, kind: probe, access: read, readback: true}
  residue_pk: {name: 残差峰值, type: float, default: 0.0, kind: probe, access: read, readback: true}
  detail: {name: 明细, type: string, default: "{}", capacity: 1024, kind: probe, access: read, readback: true}
memory: {alignment: 8}
execution: {sample_rate_independent: true, latency_samples: 0, supports_inplace: false, realtime_safe: true}
