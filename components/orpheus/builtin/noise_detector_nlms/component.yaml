id: orpheus.builtin.noise_detector_nlms
name: 噪声检测(NLMS残差)
category: 监测工具
description: 双端 A/B：用 NLMS 自适应滤波器学习 ref→in 的线性路径，残差(in−y)就是非线性失真+添加噪声；readback 上报 residue_db/erle_db/noise_frames/noise_ratio/clicks。
version: 1.0.0
abi_version: 1
package_type: source
state_type: NoiseDetectorNlmsState
sources:
  - src/noise_detector_nlms.c
headers:
  - include/orpheus_noise_detector_nlms.h
ports:
  - id: ref
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  - id: filter_length
    name: 滤波器长度
    type: int
    default: 64
    range: [1, 4096]
    update_policy: restart_required
  - id: step_size
    name: 步长
    type: float
    default: 0.1
    range: [0.0, 1.0]
    update_policy: restart_required
  - id: leakage
    name: 泄漏因子
    type: float
    default: 1.0
    range: [0.0, 1.0]
    update_policy: restart_required
  - id: eps
    name: 正则化
    type: float
    default: 0.000001
    range: [0.000000000001, 1.0]
    update_policy: restart_required
  - id: time_thres
    name: 时域残差阈值
    type: float
    default: 0.02
    range: [0.0, 1.0]
    update_policy: restart_required
  - id: frame_thres_db
    name: 帧残差预算(dB)
    type: float
    default: -25.0
    range: [-120.0, 0.0]
    unit: dB
    update_policy: restart_required
  - id: residue_db
    name: 残差能量(dB)
    type: float
    default: 0.0
    readback: true
    update_policy: immediate
  - id: erle_db
    name: ERLE(dB)
    type: float
    default: 0.0
    readback: true
    update_policy: immediate
  - id: noise_frames
    name: 噪声帧数
    type: int
    default: 0
    readback: true
    update_policy: immediate
  - id: noise_ratio
    name: 噪声占比
    type: float
    default: 0.0
    readback: true
    update_policy: immediate
  - id: clicks
    name: 突刺计数
    type: int
    default: 0
    readback: true
    update_policy: immediate
  - id: residue_pk
    name: 残差峰值
    type: float
    default: 0.0
    readback: true
    update_policy: immediate
  - id: detail
    name: 明细
    type: string
    default: "{}"
    readback: true
    update_policy: immediate
bulk_slots: []
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
