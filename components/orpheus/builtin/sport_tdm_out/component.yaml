id: orpheus.builtin.sport_tdm_out
name: SPORT/TDM 输出
category: "平台与通信"
description: >-
  图内交错 f32 到 SPORT/TDM DMA slot 的输出边界；slot 映射和格式由工程顶层
  sport_bindings 配置。in 为唯一驱动入口，每次真实到达复制到 samples 并置 valid；
  生成的 SPORT adapter 在推进后通过 in 的 read 绑定读取最新完整块并编码 slot。
  多次到达保留最后一块，不等待消费或自动排队；无硬件 IO。
platforms: [adsp21593]
version: 1.1.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [normalize, prepare, reset]
interfaces:
  in:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    sample_rate: param:sample_rate
    process: true
    host_binding: {slot: samples, access: read, status: valid}
  channels:
    name: 逻辑通道数
    description: 图内逻辑通道数；与 SPORT TDM slot 总数无关，slot 映射由顶层 sport_bindings 声明
    type: int
    default: 2
    range: [1, 64]
    update_policy: restart_required
    affects_signature: true
  sample_rate:
    name: 采样率
    description: 图端口采样率；必须与其所属时钟域和 Task 一致
    type: int
    default: 48000
    range: [1000, 384000]
    unit: Hz
    update_policy: restart_required
    affects_signature: true
  clock_domain:
    name: 时钟域
    description: 节点所属时钟域标识；编译器用于时钟链分组，组件不解释其取值
    type: string
    default: ""
    capacity: 64
    update_policy: restart_required
  valid:
    name: 已捕获输出块
    type: bool
    default: false
    kind: probe
    access: read
    update_policy: immediate
    readback: true
    persistent: false
  audio_storage:
    name: SPORT 输出存储
    type: string
    default: ""
    capacity: 1
    persistent: false
    shape: ["config:frames", "param:channels"]
    bulk: {sample_format: f32, capacity: 65536, storage: algorithm.data, slot_key: samples, double_bank: true}
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
