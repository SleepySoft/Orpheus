id: orpheus.builtin.embed_out
name: "嵌入式音频输出"
category: "输入与输出"
description: "嵌入式平台输出边界：将图内交错音频交给生成宿主或platform_io适配层；不在组件内实现硬件输出。"
platforms: [dsp]
version: 1.0.0
abi_version: 6
package_type: source
state_type: EmbedOutState
sources:
  - src/embed_out.c
headers:
  - include/orpheus_embed_out.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    sample_rate: param:sample_rate
parameters:
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  - id: sample_rate
    name: 采样率
    description: 嵌入 I/O 的采样率（Hz），连接校验要求与时钟源一致。
    type: int
    default: 48000
    range: [1000, 192000]
    unit: Hz
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
