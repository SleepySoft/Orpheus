id: orpheus.builtin.wav_out
name: WAV 文件输出
category: 基础/文件
order: 2
version: 1.0.0
abi_version: 1
package_type: source
state_type: WavOutState
sources:
  - src/wav_out.c
headers:
  - include/orpheus_wav_out.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    sample_rate: param:sample_rate
parameters:
  - id: file_path
    name: 文件路径
    type: string
    default: ""
    widget: file
    update_policy: restart_required
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  - id: sample_rate
    name: 采样率
    type: int
    default: 48000
    update_policy: restart_required
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: false
