id: orpheus.builtin.wav_out
version: 1.0.0
abi_version: 1
package_type: source
sources:
  - src/wav_out.c
headers:
  - include/orpheus_wav_out.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: file_path
    name: File Path
    type: string
    default: ""
    update_policy: restart_required
  - id: channels
    name: Channels
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  - id: sample_rate
    name: Sample Rate
    type: int
    default: 48000
    update_policy: restart_required
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: false
