id: orpheus.builtin.wav_out
name: WAV 文件输出
category: "输入与输出"
description: "离线WAV文件输出端，缓存输入音频并在宿主收尾阶段写文件；文件路径、通道数和采样率可配置，不作为实时声卡输出。"
order: 2
version: 1.1.0
abi_version: 6
package_type: source
state_type: WavOutState
sources:
  - src/wav_out.c
headers:
  - include/orpheus_wav_out.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    sample_rate: param:sample_rate
parameters:
  - id: file_path
    name: 文件路径
    type: string
    default: ""
    widget: file
    update_policy: restart_required
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 64]
    update_policy: restart_required
    affects_signature: true
  - id: sample_rate
    name: 采样率（0=跟随输入）
    type: int
    default: 0
    update_policy: restart_required
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: false
