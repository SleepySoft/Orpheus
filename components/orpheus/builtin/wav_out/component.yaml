id: orpheus.builtin.wav_out
name: WAV 文件输出
category: "输入与输出"
description: >-
  离线WAV终点，in到达仅缓存音频，不续调；宿主收尾调用destroy时落盘。
  保留16M样本会话容量，超容量明确报错，不静默截断；process不分配或写文件。
  sample_rate=0跟随输入，空路径只收集后释放，不生成文件。
order: 2
version: 1.2.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [prepare, destroy, reset]
interfaces:
  in: {direction: input, type: audio, sample_format: f32, channels: "param:channels", sample_rate: "param:sample_rate", process: true}
  file_path:
    name: 文件路径
    type: string
    capacity: 512
    default: ""
    widget: file
    update_policy: restart_required
  channels:
    name: 通道数
    type: int
    default: 2
    range: [1, 64]
    update_policy: restart_required
    affects_signature: true
  sample_rate:
    name: 采样率（0=跟随输入）
    type: int
    default: 0
    range: [0, 2147483647]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: false
