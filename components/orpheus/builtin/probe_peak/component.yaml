id: orpheus.builtin.probe_peak
name: "峰值电平表"
category: "频域与分析"
description: "对音频块所有通道的样本取一个绝对峰值，经peak读回；不是逐通道电平表。音频直通，不施加限幅或增益控制。"
order: 2
version: 1.1.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [prepare, reset]
interfaces:
  in:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    process: true
  out:
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
    drive_port_no: 1
    drive_divide: 1
  channels:
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
    readback: true
  peak:
    name: 峰值
    type: float
    default: 0.0
    readback: true
    access: read
    kind: probe
    persistent: false
    update_policy: immediate
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: true
  realtime_safe: true
