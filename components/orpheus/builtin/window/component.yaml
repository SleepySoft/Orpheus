id: orpheus.builtin.window
name: 窗函数
category: "频域与分析"
description: >-
  每次交付从系数数组开头逐样本加权；single模式超窗长部分乘1，
  repeat模式按window_size周期重复。初始系数允许不足窗长，余项补零；
  空列表取首项1、余项0。支持原地，拒绝部分重叠；系数可通过BULK整组更新。
version: 1.1.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [validate, prepare, reset]
interfaces:
  in: {direction: input, type: audio, sample_format: f32, channels: "param:channels", process: true}
  out: {direction: output, type: audio, sample_format: f32, channels: "param:channels", drive_port_no: 1, drive_divide: 1}
  window_size: {name: 窗长, type: int, default: 256, range: [2, 4096], update_policy: restart_required, affects_signature: true}
  coefficients:
    name: 系数
    type: string
    capacity: 65536
    default: "1.0"
    widget: text
    kind: bulk
    shape: [param:window_size]
    update_policy: restart_required
    bulk: {sample_format: f32, capacity: 4096, storage: algorithm.coeffs, double_bank: true}
  channels: {name: 通道数, type: int, default: 2, range: [1, 32], update_policy: restart_required, affects_signature: true}
  mode: {name: 模式, type: string, capacity: 7, default: "single", widget: select, options: ["single", "repeat"], update_policy: restart_required}
memory: {state_size: 0, scratch_size: 0, alignment: 8}
execution: {sample_rate_independent: true, latency_samples: 0, supports_inplace: true, realtime_safe: true}
