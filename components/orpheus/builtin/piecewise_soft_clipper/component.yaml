id: orpheus.builtin.piecewise_soft_clipper
name: "分段二次软削波"
category: "增益与动态"
description: 二次分段压缩曲线，支持 high/low 两套参数与 active bitmask
version: 1.0.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [validate, prepare, reset]
interfaces:
  in:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    process: true
  out:
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
    drive_port_no: 1
  xmin: {name: 高档起始点, type: float, default: 0.65, update_policy: restart_required}
  xmax: {name: 高档输入上限, type: float, default: 1.35, update_policy: restart_required}
  p2: {name: 高档二次系数, type: float, default: 0.714285731, update_policy: restart_required}
  xmin_low: {name: 低档起始点, type: float, default: 0.65, update_policy: restart_required}
  xmax_low: {name: 低档输入上限, type: float, default: 1.35, update_policy: restart_required}
  p2_low: {name: 低档二次系数, type: float, default: 0.714285731, update_policy: restart_required}
  param_set: {name: 参数档位, type: int, default: 1, range: [0, 1], update_policy: block_boundary, bindable: true}
  disabled: {name: 禁用, type: bool, default: false, update_policy: block_boundary, bindable: true}
  channels: {name: 通道数, type: int, default: 22, range: [1, 32], update_policy: restart_required, affects_signature: true}
  active_mask: {name: 激活通道位图, type: int, default: 0, kind: probe, access: read, persistent: false, readback: true, control_source: true, update_policy: immediate}
memory: {state_size: 0, scratch_size: 0, alignment: 8}
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: true
  realtime_safe: true
