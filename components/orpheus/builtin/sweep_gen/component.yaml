id: orpheus.builtin.sweep_gen
name: 扫频发生器
category: 信号源
version: 1.0.0
abi_version: 1
package_type: source
sources:
  - src/sweep_gen.c
headers:
  - include/orpheus_sweep_gen.h
ports:
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: start_freq
    name: 起始频率
    type: float
    default: 20.0
    range: [1.0, 20000.0]
    unit: Hz
    update_policy: restart_required
  - id: end_freq
    name: 结束频率
    type: float
    default: 20000.0
    range: [1.0, 20000.0]
    unit: Hz
    update_policy: restart_required
  - id: duration_s
    name: 扫频时长
    type: float
    default: 5.0
    range: [0.1, 300.0]
    unit: s
    update_policy: restart_required
  - id: amplitude
    name: 幅度
    type: float
    default: 0.7
    range: [0.0, 1.0]
    update_policy: smoothed
  - id: log_scale
    name: 对数扫频
    type: bool
    default: true
    update_policy: restart_required
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
