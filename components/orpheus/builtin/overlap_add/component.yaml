id: orpheus.builtin.overlap_add
name: 重叠相加
category: "频域与分析"
description: >-
  in驱动num_frames个完整时域帧，按hop_size重叠累加并保存跨调用尾部，
  显式交付1号out的hop_size*num_frames帧。只相加，窗口和归一化须显式外置。
version: 1.1.0
abi_version: 7
package_type: source
algorithm: {lifecycle: [normalize, prepare, reset, destroy]}
interfaces:
  in: {direction: input, type: audio, sample_format: f32, channels: "param:channels", block_size: "param:frame_size*param:num_frames", process: true}
  out: {direction: output, type: audio, sample_format: f32, channels: "param:channels", block_size: "param:hop_size*param:num_frames", drive_port_no: 1}
  channels: {name: 通道数, type: int, default: 2, range: [1, 64], update_policy: restart_required, affects_signature: true}
  frame_size: {name: 帧长, type: int, default: 128, range: [2, 4096], update_policy: restart_required, affects_signature: true}
  hop_size: {name: 帧移, type: int, default: 64, range: [1, 4096], update_policy: restart_required, affects_signature: true}
  num_frames: {name: 每次输入帧数, type: int, default: 12, range: [1, 256], update_policy: restart_required, affects_signature: true}
memory: {alignment: 8}
execution: {sample_rate_independent: true, latency_samples: 0, supports_inplace: false, realtime_safe: true}
