id: orpheus.builtin.downrate
name: "音频组块器"
category: "驱动与缓冲"
description: "连续接收N个音频块并原样拼成一个大块，采样率不变。输出截断驱动传播，消费者由自己的任务入口触发；不分频、不重采样，也不因写满自动调用消费者。"
version: 1.0.0
abi_version: 6
package_type: source
state_type: DownrateState
scheduling:
  divisor: param:factor
sources:
  - src/downrate.c
headers:
  - include/orpheus_downrate.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    propagate_drive: false
    sample_format: f32
    channels: param:channels
    block_size: in:block_size*param:factor
parameters:
  - id: factor
    name: 分频比
    type: int
    default: 4
    range: [1, 64]
    update_policy: restart_required
    affects_signature: true
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
