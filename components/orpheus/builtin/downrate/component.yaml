id: orpheus.builtin.downrate
name: 分频器
category: 高级/多速率
description: 音频组块：连续写入N个常规块形成超块；显式驱动模式下输出不传播驱动，消费入口自行设置分频
version: 1.0.0
abi_version: 6
package_type: source
state_type: DownrateState
scheduling:
  divisor: param:factor
sources:
  - src/downrate.c
headers:
  - include/orpheus_downrate.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    propagate_drive: false
    sample_format: f32
    channels: param:channels
    block_size: in:block_size*param:factor
parameters:
  - id: factor
    name: 分频比
    type: int
    default: 4
    range: [1, 64]
    update_policy: restart_required
    affects_signature: true
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
