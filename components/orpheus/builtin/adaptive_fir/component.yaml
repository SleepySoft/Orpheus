id: orpheus.builtin.adaptive_fir
name: "FxLMS自适应FIR核心"
category: "自适应与降噪"
description: x每次到达以原始参考计算输出、以deriv更新权重；err为目标麦d，内部计算误差d-secondary_gain*y
version: 1.0.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [prepare, reset, destroy, get_parameter]
interfaces:
  x:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    process: true
  deriv:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    process: false
  err:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    process: false
  out:
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
    drive_port_no: 1
  channels:
    name: 通道数
    type: int
    default: 1
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  filter_length:
    name: 阶数
    type: int
    default: 128
    range: [1, 1024]
    update_policy: restart_required
  step_size:
    name: 步长
    type: float
    default: 0.05
    range: [0.0, 2.0]
    update_policy: restart_required
  leakage:
    name: 泄漏因子
    type: float
    default: 1.0
    range: [0.0, 1.0]
    update_policy: restart_required
  eps:
    name: 正则化
    type: float
    default: 0.000001
    range: [0.000000000001, 1.0]
    update_policy: restart_required
  secondary_gain:
    name: 次级路径增益
    type: float
    default: 1.0
    range: [0.0, 10.0]
    update_policy: restart_required
  conv_metric:
    name: 收敛指标
    type: float
    default: 0.0
    kind: probe
    access: read
    readback: true
    update_policy: immediate
  detail:
    name: 明细
    type: string
    default: "{}"
    capacity: 512
    kind: probe
    access: read
    readback: true
    update_policy: immediate
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
