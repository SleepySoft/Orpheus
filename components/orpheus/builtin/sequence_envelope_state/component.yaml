id: orpheus.builtin.sequence_envelope_state
name: "序列锁存增益状态"
category: "数学与控制"
version: 1.0.0
abi_version: 7
package_type: source
algorithm: {lifecycle: [normalize, prepare, reset]}
description: >-
  targets驱动状态更新，首次锁存目标和系数；奇序列冻结，变化的偶序列接受目标并抬高当前值下界。
  全部出口先写完，再按accepted、alpha、freeze、start顺序显式交付；
  所有子调用成功返回后提交latest feedback，无块末额外延迟。
interfaces:
  targets: {direction: input, type: bulk, sample_format: f32, channels: "param:channels", block_size: 1, process: true}
  sequence: {direction: input, type: bulk, sample_format: i32, channels: 1, block_size: 1}
  coefficient: {direction: input, type: bulk, sample_format: f32, channels: 1, block_size: 1}
  feedback: {direction: input, type: bulk, sample_format: f32, channels: "param:channels", block_size: 1, timing: latest}
  start: {direction: output, type: bulk, sample_format: f32, channels: "param:channels", block_size: 1, drive_port_no: 1}
  accepted: {direction: output, type: bulk, sample_format: f32, channels: "param:channels", block_size: 1, drive_port_no: 2}
  alpha: {direction: output, type: bulk, sample_format: f32, channels: 1, block_size: 1, drive_port_no: 3}
  freeze: {direction: output, type: bulk, sample_format: i32, channels: 1, block_size: 1, drive_port_no: 4}
  channels: {name: 包络通道数, type: int, default: 20, range: [1, 128], update_policy: restart_required, affects_signature: true}
  silent: {name: 新偶序列增益下界, type: float, default: 5.0118723e-7, update_policy: restart_required}
memory: {alignment: 8}
execution: {realtime_safe: true, supports_inplace: false}
