id: orpheus.builtin.biquad
name: "二阶滤波器（Biquad）"
category: "滤波与均衡"
description: "单段二阶IIR滤波，支持低通、高通、带通、陷波、峰值及搁架响应；频率、Q和增益确定系数，可选DF1或DF2T结构。Biquad表示分子与分母均为二次式，不是两段二阶滤波。"
order: 1
version: 1.1.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [prepare, reset, set_parameter]
interfaces:
  in:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    process: true
  out:
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
    drive_port_no: 1
    drive_divide: 1
  type:
    name: 滤波器类型
    type: string
    capacity: 16
    default: lowpass
    widget: select
    options:
      - {value: lowpass, label: 低通}
      - {value: highpass, label: 高通}
      - {value: bandpass, label: 带通}
      - {value: notch, label: 陷波}
      - {value: peaking, label: 峰值}
      - {value: lowshelf, label: 低频搁架}
      - {value: highshelf, label: 高频搁架}
    update_policy: restart_required
  fc:
    name: 截止频率
    type: float
    default: 1000.0
    range: [20.0, 20000.0]
    unit: Hz
    update_policy: restart_required
  q:
    name: Q
    type: float
    default: 0.707
    range: [0.1, 10.0]
    update_policy: restart_required
  gain_db:
    name: 增益
    type: float
    default: 0.0
    range: [-24.0, 24.0]
    unit: dB
    update_policy: restart_required
  channels:
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  form:
    name: 滤波结构
    type: string
    capacity: 8
    default: df2t
    widget: select
    options:
      - {value: df2t, label: "DF-II 转置（滚动，推荐）"}
      - {value: df1, label: "DF-I（传统直接 I 型）"}
    update_policy: restart_required
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: true
  realtime_safe: true
