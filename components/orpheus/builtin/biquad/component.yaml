id: orpheus.builtin.biquad
name: 双二阶滤波器
category: 基础算法
version: 1.0.0
abi_version: 1
package_type: source
sources:
  - src/biquad.c
headers:
  - include/orpheus_biquad.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
  - id: out
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: type
    name: 滤波器类型
    type: string
    default: lowpass
    widget: select
    options:
      - {value: lowpass, label: 低通}
      - {value: highpass, label: 高通}
      - {value: bandpass, label: 带通}
      - {value: notch, label: 陷波}
      - {value: peaking, label: 峰值}
      - {value: lowshelf, label: 低频搁架}
      - {value: highshelf, label: 高频搁架}
    update_policy: restart_required
  - id: fc
    name: 截止频率
    type: float
    default: 1000.0
    range: [20.0, 20000.0]
    unit: Hz
    update_policy: restart_required
  - id: q
    name: Q
    type: float
    default: 0.707
    range: [0.1, 10.0]
    update_policy: restart_required
  - id: gain_db
    name: 增益
    type: float
    default: 0.0
    range: [-24.0, 24.0]
    unit: dB
    update_policy: restart_required
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: true
  realtime_safe: true
