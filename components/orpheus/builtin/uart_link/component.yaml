id: orpheus.builtin.uart_link
name: 串口链路
category: 平台/平台
description: 非音频组件：生成 OLINK 串口访问桥；半双工由主机轮询观测，全双工可主动上报
version: 1.0.0
abi_version: 1
package_type: source
codegen_template: uart_link
ui_hidden: true
parameters:
  - id: link_name
    name: 符号前缀
    type: string
    default: ""
    update_policy: restart_required
  - id: baud
    name: 波特率（注释用）
    type: int
    default: 921600
    range: [9600, 10000000]
    unit: bps
    update_policy: restart_required
  - id: duplex
    name: 双工能力
    type: string
    default: half
    widget: select
    options:
      - {value: half, label: 半双工（兼容基线）}
      - {value: full, label: 全双工}
    update_policy: restart_required
  - id: probe_interval_ms
    name: 观测周期
    type: float
    default: 200.0
    range: [0.0, 10000.0]
    unit: ms
    update_policy: restart_required
  - id: note
    name: 备注
    type: string
    default: ""
    update_policy: restart_required
execution:
  none: true
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
