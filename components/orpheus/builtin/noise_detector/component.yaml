id: orpheus.builtin.noise_detector
name: 单端噪声特征检测
category: 频域与分析
description: 显式FFT窗口与批次的频谱平坦度、噪声底、同通道突刺与累计削波比；直通后交付，JSON仅在非实时getter中生成
version: 1.0.0
abi_version: 7
package_type: source
algorithm:
  lifecycle: [normalize, prepare, reset, destroy, get_parameter]
interfaces:
  in:
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
    block_size: param:fft_size*param:batches
    process: true
  out:
    direction: output
    type: audio
    sample_format: f32
    channels: param:channels
    block_size: param:fft_size*param:batches
    drive_port_no: 1
  channels:
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  fft_size:
    name: FFT窗口点数
    type: int
    default: 128
    range: [4, 4096]
    update_policy: restart_required
    affects_signature: true
  batches:
    name: 顺序窗口数
    type: int
    default: 1
    range: [1, 64]
    update_policy: restart_required
    affects_signature: true
  clip_level:
    name: 削波阈值
    type: float
    default: 0.999
    range: [0.0, 1.0]
    update_policy: restart_required
  click_thres:
    name: 突刺阈值
    type: float
    default: 0.3
    range: [0.0, 1.0]
    update_policy: restart_required
  flatness:
    name: 频谱平坦度
    type: float
    default: 0.0
    kind: probe
    access: read
    readback: true
  noise_floor_db:
    name: 噪声底
    type: float
    default: 0.0
    kind: probe
    access: read
    readback: true
  clicks:
    name: 突刺计数
    type: int
    default: 0
    kind: probe
    access: read
    readback: true
  clip_pct:
    name: 削波占比
    type: float
    default: 0.0
    kind: probe
    access: read
    readback: true
  detail:
    name: 明细
    type: string
    default: "{}"
    capacity: 1024
    kind: probe
    access: read
    readback: true
memory:
  alignment: 8
execution:
  sample_rate_independent: true
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
