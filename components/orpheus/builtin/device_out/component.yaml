id: orpheus.builtin.device_out
name: 设备输出
category: 设备
version: 1.0.0
abi_version: 1
package_type: source
state_type: DeviceOutState
sources:
  - src/device_out.c
headers:
  - include/orpheus_device_out.h
ports:
  - id: in
    direction: input
    type: audio
    sample_format: f32
    channels: param:channels
parameters:
  - id: device
    name: 播放设备
    type: string
    default: ""
    widget: select
    options_source: devices
    update_policy: restart_required
  - id: channels
    name: 通道数
    type: int
    default: 2
    range: [1, 32]
    update_policy: restart_required
    affects_signature: true
  - id: sample_rate
    name: 采样率
    description: 设备请求采样率（Hz）；0 表示继承工程全局采样率。运行时按设备实际能力校验，不支持则报错，需转换则告警。
    type: int
    default: 0
    range: [0, 192000]
    update_policy: restart_required
    affects_signature: true
memory:
  state_size: 0
  scratch_size: 0
  alignment: 8
execution:
  sample_rate_independent: false
  latency_samples: 0
  supports_inplace: false
  realtime_safe: true
