[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orpheus-core"
version = "0.1.0"
description = "Orpheus audio framework core: project model, registry, compiler, builder."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "click>=8.0",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
orpheus-cli = "orpheus_core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orpheus_core*"]
