id: orpheus.test.spectral_gate
name: 频谱时间量子验收
version: 1.0.0
abi_version: 7
package_type: source
algorithm: {lifecycle: [prepare]}
interfaces:
  clock: {direction: input, type: audio, sample_format: f32, channels: "param:channels", process: true}
  spectrum: {direction: input, type: bulk, sample_format: f32, channels: "param:channels", block_size: "param:fft_size*param:num_frames", layout: halfcomplex, frame_size: "param:fft_size"}
  out: {direction: output, type: bulk, sample_format: f32, channels: "param:channels", block_size: "param:fft_size*param:num_frames", layout: halfcomplex, frame_size: "param:fft_size", drive_port_no: 1}
  channels: {type: int, default: 2, range: [1, 32], update_policy: restart_required, affects_signature: true}
  fft_size: {type: int, default: 256, range: [4, 1024], update_policy: restart_required, affects_signature: true}
  num_frames: {type: int, default: 1, range: [1, 256], update_policy: restart_required, affects_signature: true}
execution: {realtime_safe: true, supports_inplace: false}
