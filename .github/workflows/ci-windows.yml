name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            orpheus_core/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify repository
        shell: pwsh
        run: ./scripts/verify.ps1 -Python python

      - name: Record large-graph benchmark
        run: python scripts/benchmark_graph.py --nodes 128 --blocks 1000
