              0.1847713092,0.1847713092,0,-0.903714716,0\n0.1847713092,-0.3633804952,0.1847713092,-1.96658325,0.987975\n\
              0.1847713092,-0.3626303421,0.1847713092,-1.94094265,0.961092174\n0.1847713092,-0.3604449872,0.1847713092,-1.90811133,0.925899684\n\
              0.1847713092,-0.3537142525,0.1847713092,-1.86662424,0.88100481\n0.1847713092,-0.3186516793,0.1847713092,-1.82571948,0.836584747\n\
