      size: 0
      target: Ehc
      bank: 2
      description: Core 投影表 W3/W4
    - name: Model_Target_Ehc_p0_b3
      size: 0
      target: Ehc
      bank: 3
      description: Core 投影表 W1/W2
    - name: Model_Target_Ehc_p0_b4
      size: 0
      target: Ehc
      bank: 4
      description: AutoStabilizer 训练/监控阈值
    - name: Model_Target_Rnc_p15_b0
      size: 0
      target: Rnc
