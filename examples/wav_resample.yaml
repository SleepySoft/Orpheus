version: "0.1.0"
metadata:
  name: wav_resample
  description: WAV In先写入小块，交付后触发二分频读取降采样大块，再写入24k WAV
flow_mode: task_sequence
sample_rate: 48000
block_size: 128
tasks:
  - id: default
    name: Default
    sample_rate: 48000
    block_size: 128
    priority: 0
graph:
  nodes:
    - id: wav_in
      component: orpheus.builtin.wav_in
      task: default
      params:
        file_path: test_input.wav
        channels: 2
      position:
        x: 100
        y: 100
    - id: rs
      component: orpheus.builtin.resample
      task: default
      params:
        factor: 2
        channels: 2
        input_frames: 128
        output_frames: 128
      position:
        x: 350
        y: 100
    - id: read_clock
      component: orpheus.builtin.trigger_divider
      task: default
      params: {factor: 2, phase: 1}
      position: {x: 350, y: 300}
    - id: wav_out
      component: orpheus.builtin.wav_out
      task: default
      params:
        file_path: outputs/test_output.wav
        channels: 2
        sample_rate: 24000
      position:
        x: 600
        y: 100
  connections:
    - from: wav_in:out
      to: rs:in
    - from: rs:out
      to: wav_out:in
    - from: wav_in:tick
      to: read_clock:in
    - from: read_clock:out
      to: rs:tick
