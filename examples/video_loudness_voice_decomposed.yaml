version: "0.1.0"
metadata:
  name: video_loudness_voice_decomposed
  description: 教学分解版：块 RMS → 响度增益控制器 → 增益施加；其余人声增强与峰值保护同一体化示例
authoring_notes:
  control_latency: 每条控制链固定一块延迟，RMS 到增益生效共两块
sample_rate: 48000
block_size: 128
target: win
tasks:
  - id: default
    name: Default
    sample_rate: 48000
    block_size: 128
    priority: 0
graph:
  nodes:
    - id: capture
      label: 系统声音采集
      component: orpheus.builtin.device_in
      task: default
      params:
        source: loopback
        device: ""
        channels: 2
        sample_rate: 48000
      position: {x: 40, y: 300}

    - id: rms_detector
      label: 第1步：块 RMS 检测
      component: orpheus.builtin.probe_rms
      task: default
      params:
        channels: 2
      position: {x: 290, y: 300}

    - id: gain_controller
      label: 第2步：电平转目标增益
      component: orpheus.builtin.loudness_gain_control
      task: default
      params:
        level: 0.0
        target_db: -20.0
        min_gain_db: -12.0
        max_gain_db: 12.0
        gate_db: -55.0
        detector_attack_ms: 80.0
        detector_release_ms: 600.0
        gain_attack_ms: 80.0
        gain_release_ms: 1200.0
        channels: 2
      position: {x: 550, y: 300}

    - id: auto_gain
      label: 第3步：施加自动增益
      component: orpheus.builtin.gain
      task: default
      params:
        gain_db: 0.0
        smoothing_ms: 0.0
        channels: 2
      position: {x: 850, y: 300}

    - id: voice_off
      label: 人声增强关闭
      component: orpheus.builtin.gain
      task: default
      params:
        gain_db: 0.0
        smoothing_ms: 20.0
        channels: 2
      position: {x: 1110, y: 170}

    - id: voice_presence
      label: 人声存在感
      component: orpheus.builtin.midrange
      task: default
      params:
        gain_db: 3.0
        fc: 2600.0
        q: 0.9
        ramp_ms: 50.0
        channels: 2
      position: {x: 1110, y: 430}

    - id: voice_clarity
      label: 人声清晰度
      component: orpheus.builtin.treble
      task: default
      params:
        gain_db: 1.5
        fc: 5500.0
        ramp_ms: 50.0
        channels: 2
      position: {x: 1340, y: 430}

    - id: voice_select
      label: 人声增强开关（1关/2开）
      component: orpheus.builtin.n_way_mux
      task: default
      params:
        inputs: 2
        channels: 2
        select: 1
        ramp_ms: 30.0
      position: {x: 1590, y: 300}

    - id: peak_protect
      label: 峰值保护
      component: orpheus.builtin.limiter
      task: default
      params:
        mode: shared
        threshold_db: -3.0
        attack_ms: 3.0
        release_ms: 150.0
        channels: 2
      position: {x: 1840, y: 300}

    - id: output_rms
      label: 输出 RMS
      component: orpheus.builtin.probe_rms
      task: default
      params:
        channels: 2
      position: {x: 2060, y: 220}

    - id: output_peak
      label: 输出峰值
      component: orpheus.builtin.probe_peak
      task: default
      params:
        channels: 2
      position: {x: 2260, y: 220}

    - id: phones
      label: 耳机输出
      component: orpheus.builtin.device_out
      task: default
      params:
        device: ""
        channels: 2
        sample_rate: 48000
      position: {x: 2470, y: 300}

  connections:
    - {from: "capture:out", to: "rms_detector:in"}
    - {from: "rms_detector:out", to: "gain_controller:in"}
    - {from: "gain_controller:out", to: "auto_gain:in"}
    - {from: "auto_gain:out", to: "voice_off:in"}
    - {from: "auto_gain:out", to: "voice_presence:in"}
    - {from: "voice_presence:out", to: "voice_clarity:in"}
    - {from: "voice_off:out", to: "voice_select:in0"}
    - {from: "voice_clarity:out", to: "voice_select:in1"}
    - {from: "voice_select:out", to: "peak_protect:in"}
    - {from: "peak_protect:out", to: "output_rms:in"}
    - {from: "output_rms:out", to: "output_peak:in"}
    - {from: "output_peak:out", to: "phones:in"}
control_connections:
  - {from: "rms_detector:rms", to: "gain_controller:level"}
  - {from: "gain_controller:gain_db", to: "auto_gain:gain_db"}
