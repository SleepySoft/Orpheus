version: "0.1.0"
metadata:
  name: signal_probe_wav
  description: Signal Generator -> Probe RMS -> WAV Output
sample_rate: 48000
block_size: 128
tasks:
  - id: default
    name: Default
    sample_rate: 48000
    block_size: 128
    priority: 0
graph:
  nodes:
    - id: sig
      component: orpheus.builtin.signal_gen
      task: default
      params:
        frequency: 440.0
        amplitude: 0.5
        channels: 2
      position:
        x: 100
        y: 100
    - id: rms
      component: orpheus.builtin.probe_rms
      task: default
      params:
        channels: 2
      position:
        x: 300
        y: 100
    - id: wav_out
      component: orpheus.builtin.wav_out
      task: default
      params:
        file_path: C:\D\Code\git\Orpheus\examples\test_output.wav
        channels: 2
        sample_rate: 48000
      position:
        x: 500
        y: 100
  connections:
    - from: sig:out
      to: rms:in
    - from: rms:out
      to: wav_out:in
