version: "1.0.0"
metadata:
  name: external_model_heq
  description: 外部 Model_1_2 Headrest/Overhead HEQ 基础组件分解，验证目录 imports、递归 composite 与 f32 资源
sample_rate: 48000
block_size: 32
imports:
  - components/heq
graph:
  nodes:
    - id: headrest_input
      component: orpheus.builtin.signal_gen
      params: {frequency: 1000.0, amplitude: 0.1, channels: 10, duration_s: 0.02}
      position: {x: 40, y: 80}
    - id: headrest
      component: external_model.heq.headrest
      position: {x: 280, y: 80}
    - id: overhead_input
      component: orpheus.builtin.signal_gen
      params: {frequency: 2000.0, amplitude: 0.1, channels: 20, duration_s: 0.02}
      position: {x: 40, y: 260}
    - id: overhead
      component: external_model.heq.overhead
      position: {x: 280, y: 260}
    - id: overhead_sink
      component: orpheus.builtin.null_sink
      params: {channels: 4}
      position: {x: 520, y: 260}
  connections:
    - {from: headrest_input:out, to: headrest:in}
    - {from: overhead_input:out, to: overhead:in}
    - {from: overhead:out, to: overhead_sink:in}
model_tree:
  source: Model_1_2.c v7.736
  fidelity:
    level: executable_default_slice
    exact:
      - p10/p9 FIR coefficients, lengths, coefficient mapping and input mapping
      - output group summation defined by OutputMapping
    pending:
      - 40 路 Headrest 输出当前保留为未连接边界，由 plan/codegen 分配 discard buffer
      - parallel delayed-input PoolIIR branch and runtime RTC coefficient updates
      - subsystem enable/bypass state