        x: 1060
        y: 90
    connections:
    - from: buf_expand:out
      to: concat:in0
    - from: ts_expand:out
      to: concat:in1
    - from: concat:out
      to: mix_eq:in
    - from: mix_eq:out
      to: cs_mix:in
    - from: mix_eq:out
      to: left_mix:in
    - from: mix_eq:out
      to: right_mix:in
    - from: cs_mix:out
      to: cs_expand:in
    - from: left_mix:out
      to: left_expand:in
    - from: right_mix:out
      to: right_expand:in
    - from: cs_expand:out
      to: merge1:in0
    - from: left_expand:out
      to: merge1:in1
    - from: merge1:out
      to: merge2:in0
    - from: right_expand:out
      to: merge2:in1
- id: part4_peripheral_eq
  name: Medusa Part4 外围 EQ
  ports:
  - id: in
    direction: input
    maps_to: reorder:in
  - id: out
    direction: output
    maps_to: ch_delay:out
  graph:
    nodes:
    - id: reorder
      component: orpheus.builtin.input_select
      params:
        channels_in: 22
        channels_out: 22
        select: 1,2,3,4,5,6,13,14,15,16,7,8,17,18,9,19,10,20,11,21,12,22
      position:
        x: 80
        y: 100
    - id: full_rate_eq
      component: orpheus.builtin.iir_bank
      params:
        channels: 22
