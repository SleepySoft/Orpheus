version: 0.1.0
metadata:
  name: baf_sas_step0
  description: BAF SAS Model_1_1.c step0 骨架：Medusa 链 -> 反馈 -> InputSelect/PreAmp/PostProcess/Audiopilot，子系统用
    passthrough/占位实现
  distilled_from: Model_1_1.c
sample_rate: 48000
block_size: 32
graph:
  nodes:
  - id: music_src
    component: orpheus.builtin.signal_gen
    params:
      type: sine
      freq: 500.0
      amplitude: 0.2
      channels: 30
    position:
      x: 40
      y: 40
  - id: treble_src
    component: orpheus.builtin.signal_gen
    params:
      type: sine
      freq: 8000.0
      amplitude: 0.1
      channels: 2
    position:
      x: 40
      y: 200
  - id: mono_src
    component: orpheus.builtin.signal_gen
    params:
      type: sine
      freq: 250.0
      amplitude: 0.1
      channels: 1
    position:
      x: 40
      y: 360
  - id: treble_surround_src
    component: orpheus.builtin.signal_gen
    params:
      type: sine
      freq: 4000.0
      amplitude: 0.1
      channels: 7
    position:
      x: 40
      y: 520
  - id: part2_fdp
    component: sub:part2_fdp
    position:
      x: 260
      y: 200
  - id: part3_mixing
    component: sub:part3_mixing
    position:
      x: 420
      y: 200
  - id: part4_peripheral_eq
    component: sub:part4_peripheral_eq
    position:
      x: 580
      y: 200
  - id: part5_6
    component: sub:part5_6
    position:
      x: 740
      y: 200
  - id: feedback_delay
    component: orpheus.builtin.delay_line
    params:
      channels: 22
      max_delay_samples: 64
      delays_samples: 32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32
    position:
      x: 480
      y: 160
