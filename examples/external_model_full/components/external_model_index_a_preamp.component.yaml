id: external_model.index.a_preamp
name: PreAmp 与 Big6
category: 外部模型/算法索引
description: 形成 10 路节目并分出主后处理、自适应和电平检测支路
version: '2.0'
abi_version: 1
package_type: composite
ports:
- id: entertainment
  direction: input
  type: audio
  sample_format: f32
  channels: 12
  sample_rate: 48000
  block_size: 32
  maps_to: input_mixer:in
- id: microphone
  direction: input
  type: audio
  sample_format: f32
  channels: 1
  sample_rate: 48000
  block_size: 32
  maps_to: route_level:microphone
- id: post_buffer
  direction: output
  type: audio
  sample_format: f32
  channels: 32
  sample_rate: 48000
  block_size: 32
  maps_to: route_level:post_buffer
- id: adaptive
  direction: output
  type: audio
  sample_format: f32
  channels: 10
  sample_rate: 48000
  block_size: 32
  maps_to: route_level:adaptive
- id: microphone_out
  direction: output
  type: audio
  sample_format: f32
  channels: 1
  sample_rate: 48000
  block_size: 32
  maps_to: route_level:microphone_out
parameters: []
imports:
- external_model_index_a_preamp_input_mixer.component.yaml
- external_model_index_a_preamp_music_volume.component.yaml
- external_model_index_a_preamp_bass.component.yaml
- external_model_index_a_preamp_treble.component.yaml
- external_model_index_a_preamp_mid.component.yaml
- external_model_index_a_preamp_balance.component.yaml
- external_model_index_a_preamp_route_level.component.yaml
graph:
  nodes:
  - id: input_mixer
    component: external_model.index.a_preamp_input_mixer
    position:
      x: 80
      y: 80
  - id: music_volume
    component: external_model.index.a_preamp_music_volume
    position:
      x: 340
      y: 80
  - id: bass
    component: external_model.index.a_preamp_bass
    position:
      x: 600
      y: 80
  - id: treble
    component: external_model.index.a_preamp_treble
    position:
      x: 860
      y: 80
  - id: mid
    component: external_model.index.a_preamp_mid
    position:
      x: 80
      y: 260
  - id: balance
    component: external_model.index.a_preamp_balance
    position:
      x: 340
      y: 260
  - id: route_level
    component: external_model.index.a_preamp_route_level
    position:
      x: 600
      y: 260
  connections:
  - from: input_mixer:out
    to: music_volume:in
  - from: input_mixer:out
    to: route_level:program
  - from: music_volume:out
    to: bass:in
  - from: music_volume:out
    to: route_level:volume
  - from: bass:out
    to: treble:in
  - from: treble:out
    to: mid:in
  - from: mid:out
    to: balance:in
  - from: balance:out
    to: route_level:balanced
algorithm_index:
  definition_id: A.PREAMP
  tasks:
  - A0
  operations:
  - 12→10 布局
  - Volume 后主支路
  - Tone/Balance 后自适应支路
  state: []
  implementation:
    status: unsupported
    blockers:
    - id: algorithm_pending
      gate: algorithm
      reason: 尚未完成源算法逐语句实现
      source_ref: a_main
    - id: golden_pending
      gate: golden
      reason: 尚未完成参考输出对拍
      source_ref: a_main
