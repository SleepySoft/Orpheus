id: external_model.index.b_bands
name: 频带与 SRC
category: 外部模型/算法索引
description: 从 A 的十路自适应音频生成 mono、treble、surround、B3 HPF/LPF 三流与 decay
version: '2.0'
abi_version: 1
package_type: composite
ports:
- id: adaptive
  direction: input
  type: audio
  sample_format: f32
  channels: 10
  sample_rate: 48000
  block_size: 32
  maps_to: src:in
- id: mono
  direction: output
  type: audio
  sample_format: f32
  channels: 1
  sample_rate: 48000
  block_size: 32
  maps_to: mono:out
- id: treble_lr
  direction: output
  type: audio
  sample_format: f32
  channels: 2
  sample_rate: 48000
  block_size: 32
  maps_to: src:treble_lr
- id: treble_surround
  direction: output
  type: audio
  sample_format: f32
  channels: 7
  sample_rate: 48000
  block_size: 32
  maps_to: src:surround
- id: fdp_lr
  direction: output
  type: audio
  sample_format: f32
  channels: 2
  sample_rate: 11077
  block_size: 32
  maps_to: bass:hpf_lr
- id: hpf_other
  direction: output
  type: audio
  sample_format: f32
  channels: 7
  sample_rate: 11077
  block_size: 32
  maps_to: bass:hpf_other
- id: bass_lpf
  direction: output
  type: audio
  sample_format: f32
  channels: 2
  sample_rate: 11077
  block_size: 32
  maps_to: bass:bass_lpf
- id: decay
  direction: output
  type: control
  sample_format: f32
  channels: 1
  maps_to: decay:out
parameters: []
imports:
- external_model_index_b_bands_src.component.yaml
- external_model_index_b_bands_mono_detector.component.yaml
- external_model_index_b_bands_decay.component.yaml
- external_model_index_b_bands_mono.component.yaml
- external_model_index_b_bands_bass.component.yaml
graph:
  nodes:
  - id: src
    component: external_model.index.b_bands_src
    position:
      x: 80
      y: 80
  - id: mono_detector
    component: external_model.index.b_bands_mono_detector
    position:
      x: 340
      y: 80
  - id: decay
    component: external_model.index.b_bands_decay
    position:
      x: 600
      y: 80
  - id: mono
    component: external_model.index.b_bands_mono
    position:
      x: 860
      y: 80
  - id: bass
    component: external_model.index.b_bands_bass
    position:
      x: 80
      y: 260
  connections:
  - from: src:treble_lr
    to: mono_detector:in
  - from: src:treble_lr
    to: decay:in
  - from: src:deci
    to: mono:in
  - from: src:deci
    to: bass:in
algorithm_index:
  definition_id: B.BANDS
  tasks:
  - B1
  - B2
  - B3
  operations:
  - 3/13 rational SRC
  - stereo detector
  - decay estimator
  - mono weighted sum
  - 9ch HPF + 2ch LPF
  state: []
  implementation:
    status: unsupported
    blockers:
    - id: algorithm_pending
      gate: algorithm
      reason: 尚未完成源算法逐语句实现
      source_ref: b_main
    - id: golden_pending
      gate: golden
      reason: 尚未完成参考输出对拍
      source_ref: b_main
