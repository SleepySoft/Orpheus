id: external_model.index.a_runtime
name: Runtime A 全速率系统
category: 外部模型/算法索引
description: 执行输入、Big6、空间处理、输出保护和自适应响度
version: '2.0'
abi_version: 1
package_type: composite
ports:
- id: audio_in
  direction: input
  type: audio
  sample_format: f32
  channels: 30
  sample_rate: 48000
  block_size: 32
  maps_to: input_select:in
- id: mono
  direction: input
  type: audio
  sample_format: f32
  channels: 1
  sample_rate: 48000
  block_size: 32
  maps_to: audiopilot:mono
- id: treble_lr
  direction: input
  type: audio
  sample_format: f32
  channels: 2
  sample_rate: 48000
  block_size: 32
  maps_to: spatial_full:treble_lr
- id: treble_surround
  direction: input
  type: audio
  sample_format: f32
  channels: 7
  sample_rate: 48000
  block_size: 32
  maps_to: spatial_full:treble_surround
- id: post_spatial
  direction: input
  type: audio
  sample_format: f32
  channels: 22
  sample_rate: 48000
  block_size: 32
  maps_to: spatial_full:post_spatial
- id: main_out
  direction: output
  type: audio
  sample_format: f32
  channels: 22
  sample_rate: 48000
  block_size: 32
  maps_to: postprocess:main_out
- id: adaptive_audio
  direction: output
  type: audio
  sample_format: f32
  channels: 10
  sample_rate: 48000
  block_size: 32
  maps_to: audiopilot:out
parameters: []
imports:
- external_model_index_a_input_select.component.yaml
- external_model_index_a_preamp.component.yaml
- external_model_index_a_postprocess.component.yaml
- external_model_index_a_spatial_full.component.yaml
- external_model_index_a_audiopilot.component.yaml
graph:
  nodes:
  - id: input_select
    component: external_model.index.a_input_select
    position:
      x: 80
      y: 80
  - id: preamp
    component: external_model.index.a_preamp
    position:
      x: 340
      y: 80
  - id: postprocess
    component: external_model.index.a_postprocess
    position:
      x: 600
      y: 80
  - id: spatial_full
    component: external_model.index.a_spatial_full
    position:
      x: 860
      y: 80
  - id: audiopilot
    component: external_model.index.a_audiopilot
    position:
      x: 80
      y: 260
  connections:
  - from: input_select:entertainment
    to: preamp:entertainment
  - from: input_select:microphone
    to: preamp:microphone
  - from: preamp:post_buffer
    to: postprocess:preq_buffer
  - from: preamp:adaptive
    to: audiopilot:program
  - from: preamp:microphone_out
    to: audiopilot:microphone
  - from: spatial_full:protected
    to: postprocess:protected
  - from: spatial_full:analysis
    to: audiopilot:fdp_taps
algorithm_index:
  definition_id: A.RUNTIME
  tasks:
  - A0
  - A1
  - A2
  - A3
  - A4
  - A5
  operations:
  - 按 A0..A5 调度并与 Runtime B 交换原子总线
  state: []
  implementation:
    status: unsupported
    blockers:
    - id: algorithm_pending
      gate: algorithm
      reason: 尚未完成源算法逐语句实现
      source_ref: a_main
    - id: golden_pending
      gate: golden
      reason: 尚未完成参考输出对拍
      source_ref: a_main
