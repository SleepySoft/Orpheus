id: external_model.index.a_preamp_music_volume
name: 节目延迟与音量
category: 外部模型/算法索引
description: 对 10 路节目做电平检测对齐延迟和单 ramper 无跳变音量
version: '2.0'
abi_version: 1
package_type: composite
ports:
- id: in
  direction: input
  type: audio
  sample_format: f32
  channels: 10
  sample_rate: 48000
  block_size: 32
  maps_to: delay:in
- id: out
  direction: output
  type: audio
  sample_format: f32
  channels: 10
  sample_rate: 48000
  block_size: 32
  maps_to: gain:out
parameters:
- id: gain_index
  name: 音量索引
  type: float
  default: 0.0
  range:
  - 0.0
  - 255.0
  update_policy: smoothed
  direction: input
  maps_to: gain:gain_index
  bindable: true
- id: gain_offset_db
  name: 音量偏移
  type: float
  default: 0.0
  range:
  - -10.0
  - 0.0
  update_policy: block_boundary
  direction: input
  maps_to: gain:gain_offset_db
  bindable: true
- id: ramp_db_per_s
  name: 斜坡速率
  type: float
  default: 0.0
  range:
  - 0.0
  - 50000.0
  update_policy: block_boundary
  direction: input
  maps_to: gain:ramp_db_per_s
  bindable: true
- id: ramp_ms
  name: 斜坡时间
  type: float
  default: 100.0
  range:
  - 1.0
  - 3000.0
  update_policy: block_boundary
  direction: input
  maps_to: gain:ramp_ms
  bindable: true
- id: freeze
  name: 冻结斜坡
  type: bool
  default: false
  update_policy: block_boundary
  direction: input
  maps_to: gain:freeze
  bindable: true
- id: current_gain
  name: 当前线性增益
  type: float
  default: 0.04
  update_policy: immediate
  direction: output
  maps_to: gain:current_gain
  control_source: true
  readback: true
  readonly: true
  kind: state
graph:
  nodes:
  - id: delay
    component: orpheus.builtin.delay_line
    params:
      channels: 10
      max_delay_samples: 72
      delays_samples: 72,72,72,72,72,72,72,72,72,72
    position:
      x: 80
      y: 80
  - id: gain
    component: orpheus.builtin.indexed_gain
    params:
      channels: 10
      gain_index: 0.0
      gain_offset_db: 0.0
      max_gain_db: 0.0
      initial_gain: 0.04
      apply_index_on_prepare: false
      ramp_ms: 100.0
      ramp_db_per_s: 0.0
      freeze: false
      table_idx: 0,111,176,200,255,255,255,255
      table_db: -128,-72,-39.5,-27.5,0,0,0,0
    position:
      x: 340
      y: 80
  connections:
  - from: delay:out
    to: gain:in
algorithm_index:
  definition_id: A.PREAMP.MUSIC_VOLUME
  tasks:
  - A0
  operations:
  - 72 样本对齐延迟
  - 8 点索引/dB 插值
  - 逐样本指数增益
  - freeze/snap/current gain
  state:
  - id: music_delay
    role: 10 路 72 样本延迟
    initialization: generated initialization
  - id: volume_ramper
    role: current/target/ramp/frame/freeze
    initialization: generated initialization
  implementation:
    status: verified
    lowering:
      nodes:
      - id: delay
        component: orpheus.builtin.delay_line
        params:
          channels: 10
          max_delay_samples: 72
          delays_samples: 72,72,72,72,72,72,72,72,72,72
      - id: gain
        component: orpheus.builtin.indexed_gain
        params:
          channels: 10
          gain_index: 0.0
          gain_offset_db: 0.0
          max_gain_db: 0.0
          initial_gain: 0.04
          apply_index_on_prepare: false
          ramp_ms: 100.0
          ramp_db_per_s: 0.0
          freeze: false
          table_idx: 0,111,176,200,255,255,255,255
          table_db: -128,-72,-39.5,-27.5,0,0,0,0
      connections:
      - from: delay:out
        to: gain:in
      port_maps:
        in: delay:in
        out: gain:out
      parameters:
      - id: gain_index
        name: 音量索引
        type: float
        default: 0.0
        range:
        - 0.0
        - 255.0
        update_policy: smoothed
        direction: input
        maps_to: gain:gain_index
        bindable: true
      - id: gain_offset_db
        name: 音量偏移
        type: float
        default: 0.0
        range:
        - -10.0
        - 0.0
        update_policy: block_boundary
        direction: input
        maps_to: gain:gain_offset_db
        bindable: true
      - id: ramp_db_per_s
        name: 斜坡速率
        type: float
        default: 0.0
        range:
        - 0.0
        - 50000.0
        update_policy: block_boundary
        direction: input
        maps_to: gain:ramp_db_per_s
        bindable: true
      - id: ramp_ms
        name: 斜坡时间
        type: float
        default: 100.0
        range:
        - 1.0
        - 3000.0
        update_policy: block_boundary
        direction: input
        maps_to: gain:ramp_ms
        bindable: true
      - id: freeze
        name: 冻结斜坡
        type: bool
        default: false
        update_policy: block_boundary
        direction: input
        maps_to: gain:freeze
        bindable: true
      - id: current_gain
        name: 当前线性增益
        type: float
        default: 0.04
        update_policy: immediate
        direction: output
        maps_to: gain:current_gain
        control_source: true
        readback: true
        readonly: true
        kind: state
    blockers: []
