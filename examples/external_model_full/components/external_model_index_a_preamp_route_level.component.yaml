parameters: []
blockers:
- id: algorithm_pending
  gate: algorithm
  reason: 缺少可运行期更新的 32 项路由表与 block-rate RMS/hold/decay 通用原语
  source_ref: a_main
- id: state_pending
  gate: state
  reason: PreAmpReset1 对 delay/IIR/InnerLink 的运行期复位顺序尚未验证
  source_ref: a_main
- id: golden_pending
  gate: golden
  reason: 路由覆盖、预加重与 4500-block hold/decay 尚未逐块对拍
  source_ref: a_main
algorithm_index:
  definition_id: A.PREAMP.ROUTE_LEVEL
  tasks:
  - A0
  operations:
  - Volume→32 路运行期路由
  - Balance→10 路 adaptive 直通
  - Mic→Buffer2 直通
  - 72-sample program delay
  - 10 路预加重
  - RMS/Peak dB
  - AP/DynEQ InnerLink hold/decay
  state:
  - id: program_delay
    role: 10 路 72 样本 detector 对齐延迟
    initialization: 全零
    shape:
    - 720
  - id: preemphasis
    role: 10 路一阶 PoolIIR
    initialization: 全零
    shape:
    - 20
  - id: inner_links
    role: AP/DynEQ 独立 envelope/holdFlag/holdState
    initialization: generated initialization
    shape:
    - 2
  implementation:
    status: unsupported
    blockers:
    - id: algorithm_pending
      gate: algorithm
      reason: 缺少可运行期更新的 32 项路由表与 block-rate RMS/hold/decay 通用原语
      source_ref: a_main
    - id: state_pending
      gate: state
      reason: PreAmpReset1 对 delay/IIR/InnerLink 的运行期复位顺序尚未验证
      source_ref: a_main
    - id: golden_pending
      gate: golden
      reason: 路由覆盖、预加重与 4500-block hold/decay 尚未逐块对拍
      source_ref: a_main
