id: external_model.index.a_preamp_route_level
name: PreAmp 分支与电平检测
category: 外部模型/算法索引
description: 从 Volume、Balance、Mic 和 InputMixer 分出主输出、自适应和两路 block-rate level 状态
version: '2.0'
abi_version: 1
package_type: placeholder
ports:
- id: program
  direction: input
  type: audio
  sample_format: f32
  channels: 10
  sample_rate: 48000
  block_size: 32
- id: volume
  direction: input
  type: audio
  sample_format: f32
  channels: 10
  sample_rate: 48000
  block_size: 32
- id: balanced
  direction: input
  type: audio
  sample_format: f32
  channels: 10
  sample_rate: 48000
  block_size: 32
- id: microphone
  direction: input
  type: audio
  sample_format: f32
  channels: 1
  sample_rate: 48000
  block_size: 32
- id: post_buffer
  direction: output
