        channels: 22
      position:
        x: 40
        y: 320
    - id: ehc_sub
      component: sub:ehc_sub
      task: tid1
      position:
        x: 320
        y: 40
    - id: rnc_sub
      component: sub:rnc_sub
      task: tid1
      position:
        x: 320
        y: 200
    - id: output_processing
      component: sub:output_processing
      task: tid1
      position:
        x: 620
        y: 120
    - id: audio_out
      component: orpheus.builtin.wav_out
      task: tid1
      params:
        channels: 24
        sample_rate: 48000
        file_path: outputs/symphony_asm_audio_out.wav
      position:
        x: 920
        y: 40
    - id: ref_out
      component: orpheus.builtin.wav_out
      task: tid2
