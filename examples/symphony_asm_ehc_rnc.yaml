      task: tid1
      params:
        factor: 64
        channels: 12
      position:
        x: 220
        y: 520
    - id: rnc_noise_floor
      component: sub:rnc_noise_floor
      task: tid5
      params: {}
      position:
        x: 380
        y: 520
    - id: nfd_bridge
      component: orpheus.builtin.async_bridge
      task: tid5
      params: {channels: 12, capacity_frames: 0}
      position: {x: 300, y: 520}
    - id: roof_select
