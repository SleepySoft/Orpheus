      task: tid5
      params: {channels: 4, capacity_frames: 0}
      position: {x: 300, y: 660}
    - id: dd_downrate_spkr_64
      component: orpheus.builtin.downrate
      task: tid1
      params:
        factor: 64
        channels: 8
      position:
        x: 220
        y: 800
    - id: dd_downrate_spkr_4
      component: orpheus.builtin.downrate
      task: tid5
      params:
        factor: 4
        channels: 8
      position:
        x: 360
