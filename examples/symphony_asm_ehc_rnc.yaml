model_tree:
  name: Symphony ASM EHC/RNC 蒸馏（step0）
  source: cart-cicd-erev-asm/components/symphony/Model_Target*.c
  base_rate: 6000
  task_flows:
    - tid: 0
      rate_hz: 6000
      block_size: 8
      label: 最快基础步
      chains: [asm_in_fast, ehc_fast_pre, rnc_fast_pre]
    - tid: 1
      rate_hz: 2000
      block_size: 24
      label: EHC/RNC 主链 + AudioOut
      chains: [ehc_core, ehc_blade, rnc_nlms, rnc_control_filter, output_audio]
    - tid: 2
      rate_hz: 1500
      block_size: 32
      label: AudioIn / Ref_out
      chains: [audio_in, output_ref]
    - tid: 3
      rate_hz: 250
      block_size: 192
      label: EHC 慢速控制
      chains: [ehc_autostabilizer_monitor]
    - tid: 4
      rate_hz: 200
      block_size: 240
      label: RNC 慢速控制
      chains: [rnc_slow_monitor]
    - tid: 5
      rate_hz: 31.25
      block_size: 1536
      label: RNC 状态机 / 发散检测
      chains:
        - rnc_noise_floor
    - tid: 6
      rate_hz: 7.8125
      block_size: 6144
      label: RNC 噪声底 / 长期监控
      chains:
        - rnc_divergence_detector
  parameter_partitions:
    - name: Model_Target_Ehc_p0_b0
      size: 0
      target: Ehc
      bank: 0
      description: 开关、谐波使能、麦克风/扬声器校准增益、FD 路由表、覆盖开关、Blade/Core 参数
    - name: Model_Target_Ehc_p0_b1
      size: 0
      target: Ehc
      bank: 1
      description: Core Hmu / leakage 频率查找表
    - name: Model_Target_Ehc_p0_b2
      size: 0
      target: Ehc
      bank: 2
      description: Core 投影表 W3/W4
    - name: Model_Target_Ehc_p0_b3
      size: 0
      target: Ehc
      bank: 3
      description: Core 投影表 W1/W2
    - name: Model_Target_Ehc_p0_b4
      size: 0
      target: Ehc
      bank: 4
      description: AutoStabilizer 训练/监控阈值
    - name: Model_Target_Rnc_p15_b0
      size: 0
      target: Rnc
      bank: 0
      description: 传感器映射、加速度计/麦克风校准、FD 路由、开关、直通
    - name: Model_Target_Rnc_p15_b1
      size: 0
      target: Rnc
      bank: 1
      description: 各监控器阈值/增益
    - name: Model_Target_Rnc_p15_b2
      size: 0
      target: Rnc
      bank: 2
      description: NLMS 步长、收敛/发散计数器、智能饱和参数
    - name: Model_Target_Rnc_p15_b3
      size: 0
      target: Rnc
      bank: 3
      description: NLMS 扬声器-扬声器 Wiener 滤波系数
    - name: Model_Target_Rnc_p15_b4
      size: 0
      target: Rnc
      bank: 4
      description: NLMS 麦克风-扬声器 Wiener 滤波系数
    - name: Model_Target_Rnc_p15_b5
      size: 0
      target: Rnc
      bank: 5
      description: NLMS 自适应滤波初始系数
    - name: Model_Target_RncInputSelect_p9_b6
      size: 0
      target: RncInputSelect
      bank: 6
      description: 保留调参变量
    - name: Model_Target_Sys_p2_b0
      size: 0
      target: Sys
      bank: 0
      description: EHC/ENT 混合增益、RncCombine 增益/软削波、输出延迟
