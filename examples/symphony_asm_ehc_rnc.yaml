# ============================================================================
# Symphony ASM EHC/RNC step0 占位模型
# ----------------------------------------------------------------------------
# 名称：Symphony ASM EHC/RNC step0
# 来源：cart-cicd-erev-asm/components/baf/src/out/baremetalgul/slx/code/
#        Model_Target_ert_shrlib_rtw 中的 Model_Target / EHC / RncSub
# 目标：对齐 Symphony ASM（Active Sound Management）中 EHC（Engine Harmonic
#        Cancellation）与 RNC（Road Noise Cancellation）的拓扑、任务率、
#        通道数和参数分区；算法与系数全部使用 Orpheus 内置组件占位。
#
# step0 占位策略：
#   - 输入：25ch asm_in / 22ch audio_in 使用 signal_gen 占位，后续替换为
#     wav_in / device_in。
#   - EHC Core：sine_mod + gain + mixer 近似谐波振荡器/FxLMS。
#   - EHC Blade：iir_bank + gain 近似窄带误差麦克风处理。
#   - EHC AutoStabilizer：downrate -> gain -> probe_rms -> null_sink，
#     落在 TID3（250Hz）。
#   - RNC 输入处理：channel_router + iir_bank + gain 占位。
#   - RNC NLMS：12 参考 × 8 输出 × 125 taps 的真实 MIMO 更新核心；
#     filtered-error Wiener 路径和 12000 初始权值仍按需从 TOP 导入。
#   - RNC ControlFilter：fir + matrix_mul 占位。
#   - RNC 慢速控制：downrate -> gain -> probe_rms -> null_sink，落在 TID4。
#   - 输出处理：mixer 合并 EHC/RNC/娱乐音，limiter + soft_clipper 保护，
#     output_router / channel_router 产生 24ch audio_out 与 18ch ref_out。
#
# 当前通道数为示意值，后续需根据源模型 FD 路由表与物理语义回填。
# ============================================================================

version: 0.1.0
metadata:
  name: symphony_asm_ehc_rnc
  description: Symphony ASM EHC/RNC step0 骨架：拓扑/任务/参数分区对齐源模型，算法用内置组件占位
  distilled_from: cart-cicd-erev-asm/components/baf/src/out/baremetalgul/slx/code/Model_Target_ert_shrlib_rtw
sample_rate: 48000
block_size: 24
target: auto

lesson:
  title: BAF ASM 多任务 RNC 蒸馏实验
  description: 对照 out 生成代码识别任务、跨任务桥和 12×8×125 MIMO NLMS 核心。
  steps:
    - title: 核对调度
      body: 对照 Baf.exec_graph.json，确认 TID1 为 0.5 ms 基任务，TID5/TID6 为 32/128 ms 分析任务。
    - title: 核对 NLMS 维度
      body: 检查 rnc_sub 内的 rnc_mimo_nlms：12 路参考、8 路输出、125 taps，当前 TOP 步长全 0。
    - title: 检查控制闭环
      body: slow_probe.rms 通过子组件公开参数驱动 rnc_gain.gain_db。
  checks:
    - {id: compile, label: 工程可编译, type: compile_valid}
    - {id: nlms_component, label: 使用 MIMO NLMS, type: node_component, node: rnc_sub__rnc_nlms, component: orpheus.builtin.rnc_mimo_nlms}
    - {id: nlms_taps, label: NLMS 为 125 taps, type: parameter_equals, node: rnc_sub__rnc_nlms, param: filter_length, value: 125}
    - {id: control, label: 跨子图控制闭环存在, type: control_connection_exists, from: rnc_sub__slow_probe:rms, to: rnc_sub__rnc_gain:gain_db}
    - {id: bridges, label: 多任务边界显式桥接, type: task_bridge_count, minimum: 8}

tasks:
  - id: tid0
    name: TID0 6kHz
    sample_rate: 48000
    block_size: 8
  - id: tid1
    name: TID1 2kHz
    sample_rate: 48000
    block_size: 24
  - id: tid2
    name: TID2 1.5kHz
    sample_rate: 48000
    block_size: 32
  - id: tid3
    name: TID3 250Hz
    sample_rate: 48000
    block_size: 192
  - id: tid4
    name: TID4 200Hz
    sample_rate: 48000
    block_size: 240
  - id: tid5
    name: TID5 31.25Hz
    sample_rate: 48000
    block_size: 1536
  - id: tid6
    name: TID6 7.8125Hz
    sample_rate: 48000
    block_size: 6144

