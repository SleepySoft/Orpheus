version: 0.1.0
metadata:
  name: Task顺序调用与无音频参数交付
  description: 100Hz任务源驱动数组中继；分频组件每两次触发交付一次，消费者调用前接收源数组。
flow_mode: task_sequence
sample_rate: 48000
block_size: 480
graph:
  nodes:
    - id: clock
      component: orpheus.builtin.task_source
      label: 100Hz任务源
      params: {frequency_hz: 100}
      position: {x: 40, y: 120}
    - id: values
      component: orpheus.builtin.bulk_relay
      label: 源数组
      params: {count: 4, initial_values: "1,2,3,4"}
      position: {x: 340, y: 120}
    - id: consumer
      component: orpheus.builtin.bulk_relay
      label: 50Hz消费者
      params: {count: 4, initial_values: "0,0,0,0"}
      position: {x: 940, y: 120}
    - id: divide
      component: orpheus.builtin.trigger_divider
      label: 显式二分频
      params: {factor: 2, phase: 1}
      position: {x: 640, y: 120}
  connections: []
drive_connections:
  - {from: "clock:out", to: "values:in"}
  - {from: "values:out", to: "divide:in"}
  - {from: "divide:out", to: "consumer:in"}
control_connections:
  - {from: "values:values", to: "consumer:values"}
