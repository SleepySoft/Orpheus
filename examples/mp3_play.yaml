version: "0.1.0"
metadata:
  name: mp3_play
  description: MP3 Input -> Gain -> WAV Output
sample_rate: 48000
block_size: 128
tasks:
  - id: default
    name: Default
    sample_rate: 48000
    block_size: 128
    priority: 0
graph:
  nodes:
    - id: mp3
      component: orpheus.builtin.mp3_in
      task: default
      params:
        file_path: test_input.mp3
        channels: 2
      position:
        x: 100
        y: 100
    - id: gain
      component: orpheus.builtin.gain
      task: default
      params:
        gain_db: 0.0
        channels: 2
      position:
        x: 300
        y: 100
    - id: wav_out
      component: orpheus.builtin.wav_out
      task: default
      params:
        file_path: outputs/test_output.wav
        channels: 2
        sample_rate: 48000
      position:
        x: 500
        y: 100
  connections:
    - from: mp3:out
      to: gain:in
    - from: gain:out
      to: wav_out:in
