version: "0.1.0"
metadata:
  name: wav_channel_map
  description: WAV In -> 反交错 -> 交换左右声道 + 单通道增益 -> 交错 -> WAV Out
sample_rate: 48000
block_size: 128
tasks:
  - id: default
    name: Default
    sample_rate: 48000
    block_size: 128
    priority: 0
graph:
  nodes:
    - id: wav_in
      component: orpheus.builtin.wav_in
      task: default
      params:
        file_path: test_input.wav
        channels: 2
      position:
        x: 100
        y: 100
    - id: deint
      component: orpheus.builtin.deinterleave
      task: default
      params:
        channels: 2
      position:
        x: 320
        y: 100
    - id: gain_left
      component: orpheus.builtin.gain
      task: default
      params:
        gain_db: -6.0
        channels: 1
      position:
        x: 540
        y: 60
    - id: inter
      component: orpheus.builtin.interleave
      task: default
      params:
        channels: 2
      position:
        x: 760
        y: 100
    - id: wav_out
      component: orpheus.builtin.wav_out
      task: default
      params:
        file_path: outputs/test_output.wav
        channels: 2
        sample_rate: 48000
      position:
        x: 980
        y: 100
  connections:
    - from: wav_in:out
      to: deint:in
    # 通道映射即连线：左声道加增益后送到右侧输出，右声道直送左侧输出（交换 L/R）
    - from: deint:out0
      to: gain_left:in
    - from: gain_left:out
      to: inter:in1
    - from: deint:out1
      to: inter:in0
    - from: inter:out
      to: wav_out:in
