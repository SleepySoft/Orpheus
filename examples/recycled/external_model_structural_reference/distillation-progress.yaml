    io: {inputs: [band_audio, target_gain_arrays, post_spatial_audio, sequence], outputs: [bus_b_to_a_1193]}
    evidence: [cross_runtime]
    dependencies: [B.BANDS, B.MIX_CONTROL, B.POST_SPATIAL]
    orpheus_target: 结构化跨 Task 消息；需要数组控制和序列一致性
    progress: {boundary: verified, schedule: indexed, algorithm: indexed, state: indexed, parameters: verified, golden: pending}
    artifact: notes
    system_graph_eligible: false

