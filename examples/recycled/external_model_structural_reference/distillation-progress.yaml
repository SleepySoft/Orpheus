modules:
  - id: SYS.SCHEDULING
    runtime: system
    purpose: 保留两个 Runtime 的 11 个 TID、调用顺序和非整数分频，防止把慢速状态误当同速音频节点
    tids: [A0, A1, A2, A3, A4, A5, B0, B1, B2, B3, B4]
    io: {inputs: [host_tick], outputs: [runtime_a_ticks, runtime_b_ticks]}
    evidence: [runtime_a_main, runtime_b_main]
    dependencies: []
    orpheus_target: tasks + async_bridge + 独立 Runtime B 调度域
    progress: {boundary: verified, schedule: analyzed, algorithm: indexed, state: indexed, parameters: indexed, golden: pending}
    artifact: notes
    system_graph_eligible: false

  - id: SYS.BUS_A_TO_B
    runtime: system
    purpose: 同时传递 10 路自适应音频和全速率混音/Fade 当前状态，供 Runtime B 计算下一批目标
    tids: [A0, B1]
    io: {inputs: [adaptive_audio, current_gain_arrays, fade_gains], outputs: [bus_a_to_b_488]}
    evidence: [cross_runtime]
    dependencies: [A.AUDIOPILOT, A.MIX_2_TO_22, A.FADE_SUM]
    orpheus_target: 结构化跨 Task 消息；不可拆成纯音频边
    progress: {boundary: verified, schedule: indexed, algorithm: indexed, state: indexed, parameters: verified, golden: pending}
    artifact: notes
    system_graph_eligible: false

  - id: SYS.BUS_B_TO_A
