- id: A.RUNTIME
  component_id: external_model.index.a_runtime
  node_id: a_runtime
  parent: null
  name: Runtime A 全速率系统
  purpose: 执行输入、Big6、空间处理、输出保护和自适应响度
  runtime_ref: runtime_a
  task_refs:
  - A0
  - A1
  - A2
  - A3
  - A4
  - A5
  source_refs:
  - a_main
  interface:
    inputs:
    - id: audio_in
      type_ref: audio30
      maps_to: input_select:in
    outputs:
    - id: main_out
      type_ref: audio22
      maps_to: postprocess:main_out
  operations:
  - 按 A0..A5 调度并与 Runtime B 交换原子总线
  branches: []
  state: []
  parameter_refs: []
  children:
  - A.INPUT_SELECT
  - A.PREAMP
  - A.POSTPROCESS
  - A.SPATIAL_FULL
  - A.AUDIOPILOT
  body:
    edges:
    - from: input_select:entertainment
      to: preamp:entertainment
      kind: audio
      type_ref: audio12
      timing: same_call
    - from: input_select:microphone
      to: preamp:microphone
      kind: audio
      type_ref: audio1
      timing: same_call
    - from: preamp:post_buffer
      to: postprocess:preq_buffer
      kind: audio
      type_ref: audio32
      timing: same_call
    - from: preamp:adaptive
      to: audiopilot:program
      kind: audio
      type_ref: audio10
      timing: same_call
    - from: preamp:microphone_out
      to: audiopilot:microphone
      kind: audio
      type_ref: audio1
      timing: same_call
    - from: spatial_full:protected
      to: postprocess:protected
      kind: audio
      type_ref: audio22
      timing: same_call
    - from: spatial_full:analysis
      to: audiopilot:fdp_taps
      kind: audio
      type_ref: audio4
      timing: same_call
  implementation:
    status: unsupported
    blockers:
    - id: algorithm_pending
      gate: algorithm
      reason: 尚未完成源算法逐语句实现
      source_ref: a_main
    - id: golden_pending
      gate: golden
      reason: 尚未完成参考输出对拍
      source_ref: a_main
