version: "0.1.0"
metadata:
  name: headphone_music_player
  description: 电脑耳机音乐播放链路：系统声音（Loopback）→ 参考级耳机调音 + 响度补偿 + 净空保护
sample_rate: 48000
block_size: 128
tasks:
  - id: default
    name: Default
    sample_rate: 48000
    block_size: 128
    priority: 0
graph:
  nodes:
    - id: capture
      component: orpheus.builtin.device_in
      task: default
      params:
        source: loopback
        channels: 2
        sample_rate: 48000
      position: {x: 40, y: 260}
    - id: eq_shelf
      component: orpheus.builtin.biquad_bank
      task: default
      params:
        fc0: 130.0
        q0: 0.71
        gain_db0: 2.0
        fc1: 3200.0
        q1: 1.0
        gain_db1: 1.2
        channels: 2
      position: {x: 300, y: 260}
    - id: bass
      component: orpheus.builtin.bass
      task: default
      params:
        gain_db: 2.5
        fc: 100.0
        channels: 2
      position: {x: 500, y: 260}
    - id: midrange
      component: orpheus.builtin.midrange
      task: default
      params:
        gain_db: 1.5
        fc: 1300.0
        q: 1.3
        channels: 2
      position: {x: 700, y: 260}
    - id: treble
      component: orpheus.builtin.treble
      task: default
      params:
        gain_db: 1.5
        fc: 8000.0
        channels: 2
      position: {x: 900, y: 260}
    - id: saturate
      component: orpheus.builtin.saturation
      task: default
      params:
        limit: 0.7
        soft: 0.55
        channels: 2
      position: {x: 1100, y: 260}
    - id: router
      component: orpheus.builtin.channel_router
      task: default
      params:
        channels_in: 2
        channels_out: 2
        indices: "0,1"
      position: {x: 1300, y: 260}
    - id: width
      component: orpheus.builtin.delay
      task: default
      params:
        delay_ms: 7.0
        mix: 0.22
        channels: 2
      position: {x: 1500, y: 260}
    - id: loudness
      component: orpheus.builtin.sleeping_beauty
      task: default
      params:
        gain_index: 118.0
        offset: 128.0
        mutes_bass: 0.0
        ramp_ms: 30.0
        channels: 2
        chan_map: "0,1"
      position: {x: 1700, y: 260}
    - id: density
      component: orpheus.builtin.soft_clipper
      task: default
      params:
        drive_db: 2.5
        channels: 2
      position: {x: 1900, y: 260}
    - id: meter_pre
      component: orpheus.builtin.probe_rms
      task: default
      params:
        channels: 2
      position: {x: 2050, y: 180}
    - id: peak_protect
      component: orpheus.builtin.limiter
      task: default
      params:
        mode: shared
        threshold_db: -2.5
        attack_ms: 3.0
        release_ms: 150.0
        channels: 2
      position: {x: 2200, y: 260}
    - id: meter_post
      component: orpheus.builtin.probe_peak
      task: default
      params:
        channels: 2
      position: {x: 2350, y: 180}
    - id: phones
      component: orpheus.builtin.device_out
      task: default
      params:
        channels: 2
        sample_rate: 48000
      position: {x: 2500, y: 260}
  connections:
    - {from: "capture:out", to: "eq_shelf:in"}
    - {from: "eq_shelf:out", to: "bass:in"}
    - {from: "bass:out", to: "midrange:in"}
    - {from: "midrange:out", to: "treble:in"}
    - {from: "treble:out", to: "saturate:in"}
    - {from: "saturate:out", to: "router:in"}
    - {from: "router:out", to: "width:in"}
    - {from: "width:out", to: "loudness:in"}
    - {from: "loudness:out", to: "density:in"}
    - {from: "density:out", to: "meter_pre:in"}
    - {from: "meter_pre:out", to: "peak_protect:in"}
    - {from: "peak_protect:out", to: "meter_post:in"}
    - {from: "meter_post:out", to: "phones:in"}