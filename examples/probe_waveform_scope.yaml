version: "0.1.0"
metadata:
  name: probe_waveform_scope
  description: Signal Generator -> Probe Waveform -> WAV Output（节点内嵌示波器显示波形）
sample_rate: 48000
block_size: 128
tasks:
  - id: default
    name: Default
    sample_rate: 48000
    block_size: 128
    priority: 0
graph:
  nodes:
    - id: sig
      component: orpheus.builtin.signal_gen
      task: default
      params:
        frequency: 440.0
        amplitude: 0.5
        channels: 2
      position:
        x: 100
        y: 100
    - id: scope
      component: orpheus.builtin.probe_waveform
      task: default
      params:
        channels: 2
      position:
        x: 300
        y: 100
    - id: wav_out
      component: orpheus.builtin.wav_out
      task: default
      params:
        file_path: outputs/test_output.wav
        channels: 2
        sample_rate: 48000
      position:
        x: 500
        y: 100
  connections:
    - from: sig:out
      to: scope:in
    - from: scope:out
      to: wav_out:in
